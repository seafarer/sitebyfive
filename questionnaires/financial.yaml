market: financial
title: Bookkeeping & financial services website questionnaire
questions:
  - id: clients
    ask: Who do you work with, and what problem do you solve for them?
    help: The kinds of clients you're best for, and what's different about working with you.
    kind: longtext
    required: true
    feeds: ["home:blocks[0].**", "home:blocks[1].**", "services:blocks[1].**"]

  - id: services
    ask: What services do you offer?
    kind: list
    fields: [Service, Who it's for, "What's included"]
    required: true
    feeds: ["home:blocks[2].**", "home:blocks[3].**", "services:blocks[0].**"]

  - id: process
    ask: What happens when a new client starts with you?
    help: Three or four steps, from the first call to ongoing work.
    kind: longtext
    feeds: ["home:blocks[4].**", "home:blocks[5].**"]

  - id: pricing
    ask: How do you price your work?
    help: Packages or rates, what's included, and anything billed separately. "Starting at" prices are fine.
    kind: list
    fields: [Service or package, Price, "Per (month, hour, return…)", "What's included"]
    feeds: ["services:blocks[2].**", "services:blocks[4].**"]

  - id: questions
    ask: What do prospective clients usually ask before hiring you?
    help: Three to six questions, with your answers.
    kind: longtext
    feeds: ["services:blocks[3].**", "contact:blocks[2].**"]

  - id: team
    ask: Who's on your team?
    help: Only real credentials (CPA, EA, certifications) and only people who've agreed to be listed.
    kind: people
    fields: [Name, Role, Credentials, One or two sentences]
    feeds: ["team:blocks[*].**"]

  - id: resources
    ask: Which resources, forms, or links should clients be able to find?
    help: Client portal, document checklists, payment links, deadline calendars, required disclosures.
    kind: list
    fields: [Name, Link (if online), One line about it]
    feeds: ["resources:blocks[*].**"]

  - id: contact-form
    ask: What should the contact form ask, and how quickly do you reply?
    kind: longtext
    feeds: ["contact:blocks[0].**", "contact:blocks[1].**"]
