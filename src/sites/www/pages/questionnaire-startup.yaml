# Generated from questionnaires/startup.yaml by `npm run questionnaire`. Edit the questionnaire, not this file.
slug: /start/startup
title: Startup questionnaire | Site by Five
description: "Startup website questionnaire: the questions we use to write your site."
noindex: true
chrome:
  announcement: false
  nav:
    minimal: true
    cta: false
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: Start your site · Startup
    heading: Startup website questionnaire
    intro: |-
      These questions give us everything we need to write your site. Short answers are fine; bullet points
      are fine. If you already have a brochure, an old website, or a document that covers some of this,
      email it to hello@sitebyfive.com and skip what it answers. Photos, your logo, and documents come in the next step, so for now just tell us what you have. Anything you leave blank shows up in your preview as a
      clearly marked "add this later" note, never as made-up filler.
  - type: contact
    variant: form
    id: questionnaire
    form:
      subject: "Questionnaire: Startup"
      fields:
        - name: your_name
          label: Your name
          kind: text
          required: true
        - name: email
          label: Email
          kind: email
          required: true
        - name: organization
          label: Organization
          kind: text
          required: true
        - name: basics
          label: What's your organization called, and what do you do, in a sentence or two?
          kind: textarea
          required: true
          help: The way you'd explain it to a neighbor. Include who you serve and where.
        - name: product
          label: What does your product do, who is it for, and why now?
          kind: textarea
          required: true
          help: The problem, who has it, and why existing options fall short.
        - name: capabilities
          label: What are the three to six things the product does best?
          kind: textarea
          required: true
          help: "For each: Capability · What it means for the customer."
        - name: uses
          label: Who uses it, and for what?
          kind: textarea
          required: false
          help: "Customer types or use cases, with a sentence on each. Real customers only. For each: Customer type or use case · How they use it."
        - name: getting-started
          label: How does a customer get started?
          kind: textarea
          required: false
          help: Steps from first conversation to running in production, including any pilot or trial.
        - name: pricing
          label: How is it priced?
          kind: textarea
          required: false
          help: "Plans or pilot pricing, what's included, and what changes at each level. Leave blank if pricing isn't public. For each: Plan · Price · What's included."
        - name: questions
          label: What do prospects ask on a first call?
          kind: textarea
          required: false
          help: Four to eight questions, with your answers.
        - name: team
          label: Who's on the team, and what's the company story?
          kind: textarea
          required: false
          help: "Founders and key people, with permission. Where you're based, when you started, real investors or partners if you want them named. For each: Name · Role · One or two sentences."
        - name: contact
          label: How should people reach you?
          kind: textarea
          required: true
          help: Phone, public email, street address (and any directions, like "use the side door"), and the inbox where website messages should go.
        - name: hours
          label: When are you open or available?
          kind: textarea
          required: false
          help: Regular hours, plus anything seasonal or by appointment.
        - name: voice
          label: Which words describe how you want to come across?
          kind: text
          required: false
          help: "Pick up to three, or add your own. For example: Warm, Professional, Playful, Calm, Bold, Straightforward, Neighborly, Expert."
      submitLabel: Send my answers
      successText: Thanks! We have your answers. You'll hear from us by 5pm the next business day with your preview, or a note about anything missing.
  - type: intro
    variant: two-column
    tone: tint
    id: photos
    eyebrow: Next step
    heading: Send your photos and files
    body: After you send your answers, we'll email you a private link to upload your logo, photos, and any documents you listed (reports, forms, menus). Real photos of your people, place, and work beat stock photos every time.
