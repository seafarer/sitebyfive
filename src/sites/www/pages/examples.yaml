slug: /examples
title: Examples | Site by Five
description: Six live websites built with Site by Five, for a plumber, a property manager, a food pantry, an orchard, a fly-fishing outfitter, and a preschool.
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: Examples
    heading:
      text: Real sites, not mockups.
      accent: not mockups.
    intro: Each example is a live site built with Site by Five for a fictional business, one for each kind of organization we serve. Click through them on your phone too.

  - type: cards
    variant: image
    columns: 3
    items:
      - label: Trades · Bright look
        title: Juniper Plumbing & Heating
        body: "A family plumbing and heating company. A call button on every page, a 24/7 emergency banner, services with starting prices, the towns it serves, and reviews."
        image: { src: examples/juniper.png, alt: The Juniper Plumbing & Heating home page, focal: "50% 0%" }
        link: { label: Visit the site, href: "https://juniper.sitebyfive.com" }
      - label: Property management · Business look
        title: Larkspur Property Care
        body: "Property management and caretaking for mountain second homes. Services and fees, how reporting works for owners, an owner portal link, and seasonal notes."
        image: { src: examples/larkspur.png, alt: The Larkspur Property Care home page, focal: "50% 0%" }
        link: { label: Visit the site, href: "https://larkspur.sitebyfive.com" }
      - label: Outdoor · Bright look
        title: Kestrel Fly & Float
        body: "A fly-fishing guide service. Full-bleed photography, trips and prices with Book buttons to booking software, trip planning, guides, and a river report."
        image: { src: examples/kestrel.png, alt: The Kestrel Fly & Float home page, focal: "50% 0%" }
        link: { label: Visit the site, href: "https://kestrel.sitebyfive.com" }
      - label: Nonprofits & districts · Muted look
        title: Alder Springs Food Share
        body: "An all-volunteer food pantry. Answers 'how do I get food?' first, then volunteering and giving. Board meetings, public documents, and an accessibility statement."
        image: { src: examples/aldersprings.png, alt: The Alder Springs Food Share home page, focal: "50% 0%" }
        link: { label: Visit the site, href: "https://aldersprings.sitebyfive.com" }
      - label: Farms · Warm look
        title: High Mesa Orchard
        body: "A family orchard and farm stand. What's picking now, seasonal hours, this week's prices, a harvest calendar, and events that disappear once they've passed."
        image: { src: examples/highmesa.png, alt: The High Mesa Orchard home page, focal: "50% 0%" }
        link: { label: Visit the site, href: "https://highmesa.sitebyfive.com" }
      - label: Early education · Fun look
        title: Puddlejump Early School
        body: "A play-based preschool. Photo-rich: programs with tuition, a day at school, teachers, family resources, and tour booking. A rounded, friendly look with a playful underline."
        image: { src: examples/puddlejump.png, alt: The Puddlejump Early School home page, focal: "50% 0%" }
        link: { label: Visit the site, href: "https://puddlejump.sitebyfive.com" }
  - type: intro
    variant: two-column
    tone: tint
    eyebrow: Custom work
    heading: Need something the examples don't do?
    body: "Most organizations fit a plan with a few changes. When you need something specific, like an embedded booking calendar, an online store, or a donation thermometer, we build it as custom work, quoted up front, and it sits alongside everything else in your look."
    link: { label: Ask about custom work, href: /start, style: text }

  - type: cta
    variant: simple
    tone: inverse
    heading: Like one of these? Start there.
    ctas:
      - { label: Start your site, href: /start, style: primary }
