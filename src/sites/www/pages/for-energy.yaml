slug: /for/energy
title: "Solar & energy | Site by Five"
description: "Five-page websites for solar & energy: a ready page plan, a live example, and a real developer's review. Live by 5pm the next business day."
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: "For solar & energy"
    heading:
      text: "Turn visitors into consultations."
      accent: "consultations."
    breadcrumbs: true

  - type: intro
    variant: two-column
    eyebrow: Why it works
    heading: Built around what your visitors need
    body: "Homeowners and businesses want to know three things: will it pay off, can I trust you, and what happens next. Your site shows your real installs, explains the steps and incentives in plain language, and puts a consultation form one click away from every page."

  - type: featureRows
    tone: tint
    items:
      - label: "Live example · Bright"
        title: "Mesa Ridge Solar"
        body: "A real site built with Site by Five, using this plan. Click around: yours starts from the same structure, with your words, photos, colors, and logo."
        image: { src: examples/mesaridge.png, alt: "The Mesa Ridge Solar home page" }
        link: { label: Visit the example, href: "https://mesaridge.sitebyfive.com", style: text }

  - type: features
    variant: list
    eyebrow: Your pages
    heading: The page plan
    intro: "This plan has six pages, including Contact."
    items:
      - { title: "Home", body: "Why go solar, residential and commercial paths, and service for existing systems." }
      - { title: "Residential", body: "System types and the steps from first call to power-on." }
      - { title: "Commercial", body: "Farms, businesses, and nonprofits, with a gallery of real installs." }
      - { title: "About", body: "Your story, team, and how you work." }
      - { title: "Incentives", body: "Credits, rebates, and financing, carefully worded." }
      - { title: "Contact", body: "A consultation request form and your details." }

  - type: faq
    variant: split
    tone: tint
    eyebrow: Questions
    heading: "For solar & energy"
    items:
      - { q: "Can you keep incentive information accurate?", a: "We write incentive pages carefully and avoid promising specific amounts. When programs change, send us a note and we'll update it as part of your monthly edits." }
      - { q: "Can we show our projects?", a: "Yes. A project gallery with a line on each install is part of the plan. Real projects only." }
      - { q: "Will the form tell us what the customer wants?", a: "Yes. The consultation form asks for address, system interest, and anything else you choose." }

  - type: cta
    variant: simple
    tone: inverse
    heading: Order today. Live by five tomorrow.
    ctas:
      - { label: Start your site, href: /start, style: primary }
      - { label: See pricing, href: /pricing, style: secondary }
