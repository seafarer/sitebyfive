# Generated from questionnaires/outdoor.yaml by `npm run questionnaire`. Edit the questionnaire, not this file.
slug: /start/outdoor
title: Outdoor guide / outfitter questionnaire | Site by Five
description: "Outdoor guide & outfitter website questionnaire: the questions we use to write your site."
noindex: true
chrome:
  announcement: false
  nav:
    minimal: true
    cta: false
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: Start your site · Outdoor guide / outfitter
    heading: Outdoor guide & outfitter website questionnaire
    intro: |-
      These questions give us everything we need to write your site. Short answers are fine; bullet points
      are fine. If you already have a brochure, an old website, or a document that covers some of this,
      email it to hello@sitebyfive.com and skip what it answers. Photos, your logo, and documents come in the next step, so for now just tell us what you have. Anything you leave blank shows up in your preview as a
      clearly marked "add this later" note, never as made-up filler.
  - type: contact
    variant: form
    id: questionnaire
    form:
      subject: "Questionnaire: Outdoor guide / outfitter"
      fields:
        - name: your_name
          label: Your name
          kind: text
          required: true
        - name: email
          label: Email
          kind: email
          required: true
        - name: organization
          label: Organization
          kind: text
          required: true
        - name: basics
          label: What's your organization called, and what do you do, in a sentence or two?
          kind: textarea
          required: true
          help: The way you'd explain it to a neighbor. Include who you serve and where.
        - name: trips
          label: What trips do you offer?
          kind: textarea
          required: true
          help: "For each: name, how long, group size, price, and what's included (gear, meals, transport). For each: Trip · Length · Group size · Price · What's included."
        - name: booking
          label: How do people book?
          kind: textarea
          required: true
          help: Your booking link (FareHarbor, Peek, Checkfront, and so on), plus a link for each trip if it has one. Deposits, if any.
        - name: why-you
          label: Why should someone go with you?
          kind: textarea
          required: true
          help: What's included, who your trips suit (beginners, families, experts), safety training, and licenses or permits exactly as you want them listed.
        - name: season
          label: When is your season?
          kind: textarea
          required: false
          help: The months you run, and what's special about each part of the season.
        - name: policies
          label: What should guests know before they come?
          kind: textarea
          required: true
          help: What to bring, where to meet, licenses they need, your cancellation and weather policy, tipping, and any age limits.
        - name: guides
          label: Who are your guides?
          kind: textarea
          required: false
          help: "Names, how long they've guided, and a line about each, with permission. Photos come in the next step. For each: Name · Role · One line."
        - name: featured-trip
          label: Is there one trip or week you'd like its own page?
          kind: textarea
          required: false
          help: A special hatch, an opener, a multi-day trip. We'll build a focused page with one booking button.
        - name: reports
          label: Would you like a river or conditions report?
          kind: textarea
          required: false
          help: Short posts on conditions and what's working. We'll set it up; you send a few lines whenever you like.
        - name: reviews
          label: Any reviews we can quote?
          kind: textarea
          required: false
          help: Two or three real reviews with a name (or first name and hometown), with permission.
        - name: contact
          label: How should people reach you?
          kind: textarea
          required: true
          help: Phone, public email, street address (and any directions, like "use the side door"), the towns or area you serve, and the inbox where website messages should go.
        - name: hours
          label: When are you open or available?
          kind: textarea
          required: false
          help: 'Regular hours, plus anything seasonal ("June–Oct: daily 9–6"), after-hours or emergency lines, and by appointment.'
        - name: voice
          label: Which words describe how you want to come across?
          kind: text
          required: false
          help: "Pick up to three, or add your own. For example: Warm, Professional, Playful, Calm, Bold, Straightforward, Neighborly, Expert."
        - name: plan
          label: Which plan would you like?
          kind: select
          required: false
          options:
            - Monthly ($49/month)
            - Yearly ($490/year)
            - Not sure yet
          help: Both include hosting, SSL, and 30 minutes of edits a month. Setup is $595 ($495 for nonprofits and special districts) either way.
        - name: domain
          label: Do you already have a domain name? If so, what is it, and where is it registered?
          kind: text
          required: false
          help: For example "maplewoodschool.org, at GoDaddy". If you don't have one, leave this blank and your site can launch at yourname.sitebyfive.com. Connecting your own domain is a $95 add-on.
      submitLabel: Send my answers
      successText: "Thanks, your answers are in! Within one business day we'll email you three things: a Dropbox link for your logo, photos, and documents (or just reply with them attached), your invoice, and any questions about your answers. Once your files are in and the invoice is paid, your site is live by 5pm the next business day."
  - type: intro
    variant: two-column
    tone: tint
    id: photos
    eyebrow: Next step
    heading: Send your photos and files
    body: After you send your answers, we'll email you a private Dropbox link for your logo, photos, and any documents you listed (reports, forms, menus). Or just email them to hello@sitebyfive.com. Real photos of your people, place, and work beat stock photos every time.
