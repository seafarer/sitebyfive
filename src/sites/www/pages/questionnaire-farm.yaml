# Generated from questionnaires/farm.yaml by `npm run questionnaire`. Edit the questionnaire, not this file.
slug: /start/farm
title: Farm / local food questionnaire | Site by Five
description: "Farm & local food website questionnaire: the questions we use to write your site."
noindex: true
chrome:
  announcement: false
  nav:
    minimal: true
    cta: false
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: Start your site · Farm / local food
    heading: Farm & local food website questionnaire
    intro: |-
      These questions give us everything we need to write your site. Short answers are fine; bullet points
      are fine. If you already have a brochure, an old website, or a document that covers some of this,
      email it to hello@sitebyfive.com and skip what it answers. Photos, your logo, and documents come in the next step, so for now just tell us what you have. Anything you leave blank shows up in your preview as a
      clearly marked "add this later" note, never as made-up filler.
  - type: contact
    variant: form
    id: questionnaire
    form:
      subject: "Questionnaire: Farm / local food"
      fields:
        - name: your_name
          label: Your name
          kind: text
          required: true
        - name: email
          label: Email
          kind: email
          required: true
        - name: organization
          label: Organization
          kind: text
          required: true
        - name: basics
          label: What's your organization called, and what do you do, in a sentence or two?
          kind: textarea
          required: true
          help: The way you'd explain it to a neighbor. Include who you serve and where.
        - name: farm
          label: What do you grow, raise, or make?
          kind: textarea
          required: true
          help: Fruit, vegetables, beef, eggs, wine, flowers, honey. A line on what you're known for.
        - name: seasons
          label: What's available when?
          kind: textarea
          required: true
          help: "Month by month (or season by season): what's ready, and when the stand, tasting room, or market booth is open. For each: When · What's available."
        - name: prices
          label: Which prices are you happy to publish?
          kind: textarea
          required: false
          help: "Per pound, per box, per share, per bottle. We'll mark items \"In season\" or \"Sold out\" and you can send changes any time. For each: Item · Price · Unit."
        - name: visiting
          label: How do people buy from you or visit?
          kind: textarea
          required: true
          help: Farm stand, U-pick, CSA or shares, farmers' markets, online orders, wholesale. Include payment you take, parking, dogs, and accessibility.
        - name: events
          label: Do you hold events?
          kind: textarea
          required: false
          help: U-pick weekends, festivals, dinners, tastings, market days. We'll list them with dates as they're scheduled.
        - name: story
          label: What's the story of your farm?
          kind: textarea
          required: false
          help: How it started, who runs it now, and how you grow or raise things. Names with permission.
        - name: contact-form
          label: What should people be able to contact you about?
          kind: text
          required: false
          help: For example visits, preorders, wholesale, or events.
        - name: contact
          label: How should people reach you?
          kind: textarea
          required: true
          help: Phone, public email, street address (and any directions, like "use the side door"), the towns or area you serve, and the inbox where website messages should go.
        - name: hours
          label: When are you open or available?
          kind: textarea
          required: false
          help: 'Regular hours, plus anything seasonal ("June–Oct: daily 9–6"), after-hours or emergency lines, and by appointment.'
        - name: voice
          label: Which words describe how you want to come across?
          kind: text
          required: false
          help: "Pick up to three, or add your own. For example: Warm, Professional, Playful, Calm, Bold, Straightforward, Neighborly, Expert."
        - name: plan
          label: Which plan would you like?
          kind: select
          required: false
          options:
            - Monthly ($49/month)
            - Yearly ($490/year)
            - Not sure yet
          help: Both include hosting, SSL, and 30 minutes of edits a month. Setup is $595 ($495 for nonprofits and special districts) either way.
        - name: domain
          label: Do you already have a domain name? If so, what is it, and where is it registered?
          kind: text
          required: false
          help: For example "maplewoodschool.org, at GoDaddy". If you don't have one, leave this blank and your site can launch at yourname.sitebyfive.com. Connecting your own domain is a $95 add-on.
      submitLabel: Send my answers
      successText: "Thanks, your answers are in! Within one business day we'll email you three things: a Dropbox link for your logo, photos, and documents (or just reply with them attached), your invoice, and any questions about your answers. Once your files are in and the invoice is paid, your site is live by 5pm the next business day."
  - type: intro
    variant: two-column
    tone: tint
    id: photos
    eyebrow: Next step
    heading: Send your photos and files
    body: After you send your answers, we'll email you a private Dropbox link for your logo, photos, and any documents you listed (reports, forms, menus). Or just email them to hello@sitebyfive.com. Real photos of your people, place, and work beat stock photos every time.
