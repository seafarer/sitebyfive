# Generated from questionnaires/property.yaml by `npm run questionnaire`. Edit the questionnaire, not this file.
slug: /start/property
title: Property management questionnaire | Site by Five
description: "Property management & caretaking website questionnaire: the questions we use to write your site."
noindex: true
chrome:
  announcement: false
  nav:
    minimal: true
    cta: false
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: Start your site · Property management
    heading: Property management & caretaking website questionnaire
    intro: |-
      These questions give us everything we need to write your site. Short answers are fine; bullet points
      are fine. If you already have a brochure, an old website, or a document that covers some of this,
      email it to hello@sitebyfive.com and skip what it answers. Photos, your logo, and documents come in the next step, so for now just tell us what you have. Anything you leave blank shows up in your preview as a
      clearly marked "add this later" note, never as made-up filler.
  - type: contact
    variant: form
    id: questionnaire
    form:
      subject: "Questionnaire: Property management"
      fields:
        - name: your_name
          label: Your name
          kind: text
          required: true
        - name: email
          label: Email
          kind: email
          required: true
        - name: organization
          label: Organization
          kind: text
          required: true
        - name: basics
          label: What's your organization called, and what do you do, in a sentence or two?
          kind: textarea
          required: true
          help: The way you'd explain it to a neighbor. Include who you serve and where.
        - name: services
          label: What do you do for owners?
          kind: textarea
          required: true
          help: "Full management, caretaking or home watch, seasonal opening and closing, vacation-rental turnovers, vendor coordination, and so on. A sentence on each. For each: Service · One sentence about it."
        - name: properties
          label: What kinds of properties do you look after, and where?
          kind: textarea
          required: true
          help: Second homes, rentals, condos, ranches. List the towns or areas you cover, and roughly how many homes you care for if you'd like to say.
        - name: fees
          label: How do you price your services?
          kind: textarea
          required: false
          help: Starting prices, a monthly fee, a percentage, or "by proposal" are all fine. Also how you bill vendor work.
        - name: owner-experience
          label: How does working with you go for an owner?
          kind: textarea
          required: true
          help: The steps from first call to first visit, what reports owners get and how often, and your owner portal or app (with its login link), if you have one.
        - name: owner-questions
          label: What do owners ask before they hire you?
          kind: textarea
          required: false
          help: "Three to six questions with your answers: keys and security, emergencies, insurance and bonding, approving work."
        - name: story
          label: What's your story, and who's on the team?
          kind: textarea
          required: false
          help: How you started, how long you've been at it, and the people owners will deal with, with names and roles (and permission).
        - name: consultation
          label: What should the consultation form ask?
          kind: text
          required: false
          help: For example the property's location, type, and the services an owner is interested in.
        - name: seasonal-notes
          label: Would you like a "seasonal notes" section?
          kind: textarea
          required: false
          help: Short posts like a spring opening checklist or tips for closing up for winter. Tell us a few topics; we can start you with one or two.
        - name: testimonials
          label: Any owners we can quote?
          kind: textarea
          required: false
          help: Two or three real quotes with a name (or "The Smith family, owners since 2013"). Only with their permission.
        - name: contact
          label: How should people reach you?
          kind: textarea
          required: true
          help: Phone, public email, street address (and any directions, like "use the side door"), the towns or area you serve, and the inbox where website messages should go.
        - name: hours
          label: When are you open or available?
          kind: textarea
          required: false
          help: 'Regular hours, plus anything seasonal ("June–Oct: daily 9–6"), after-hours or emergency lines, and by appointment.'
        - name: voice
          label: Which words describe how you want to come across?
          kind: text
          required: false
          help: "Pick up to three, or add your own. For example: Warm, Professional, Playful, Calm, Bold, Straightforward, Neighborly, Expert."
        - name: plan
          label: Which plan would you like?
          kind: select
          required: false
          options:
            - Monthly ($49/month)
            - Yearly ($490/year)
            - Not sure yet
          help: Both include hosting, SSL, and 30 minutes of edits a month. Setup is $595 ($495 for nonprofits and special districts) either way.
        - name: domain
          label: Do you already have a domain name? If so, what is it, and where is it registered?
          kind: text
          required: false
          help: For example "maplewoodschool.org, at GoDaddy". If you don't have one, leave this blank and your site can launch at yourname.sitebyfive.com. Connecting your own domain is a $95 add-on.
      submitLabel: Send my answers
      successText: "Thanks, your answers are in! Within one business day we'll email you three things: a Dropbox link for your logo, photos, and documents (or just reply with them attached), your invoice, and any questions about your answers. Once your files are in and the invoice is paid, your site is live by 5pm the next business day."
  - type: intro
    variant: two-column
    tone: tint
    id: photos
    eyebrow: Next step
    heading: Send your photos and files
    body: After you send your answers, we'll email you a private Dropbox link for your logo, photos, and any documents you listed (reports, forms, menus). Or just email them to hello@sitebyfive.com. Real photos of your people, place, and work beat stock photos every time.
