# Generated from questionnaires/energy.yaml by `npm run questionnaire`. Edit the questionnaire, not this file.
slug: /start/energy
title: Solar / energy questionnaire | Site by Five
description: "Solar & energy installer website questionnaire: the questions we use to write your site."
noindex: true
chrome:
  announcement: false
  nav:
    minimal: true
    cta: false
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: Start your site · Solar / energy
    heading: Solar & energy installer website questionnaire
    intro: |-
      These questions give us everything we need to write your site. Short answers are fine; bullet points
      are fine. If you already have a brochure, an old website, or a document that covers some of this,
      email it to hello@sitebyfive.com and skip what it answers. Photos, your logo, and documents come in the next step, so for now just tell us what you have. Anything you leave blank shows up in your preview as a
      clearly marked "add this later" note, never as made-up filler.
  - type: contact
    variant: form
    id: questionnaire
    form:
      subject: "Questionnaire: Solar / energy"
      fields:
        - name: your_name
          label: Your name
          kind: text
          required: true
        - name: email
          label: Email
          kind: email
          required: true
        - name: organization
          label: Organization
          kind: text
          required: true
        - name: basics
          label: What's your organization called, and what do you do, in a sentence or two?
          kind: textarea
          required: true
          help: The way you'd explain it to a neighbor. Include who you serve and where.
        - name: company
          label: Tell us about the company.
          kind: textarea
          required: true
          help: When and how you started, where you work, and what you want customers to know about how you operate (local ownership, no commissions, warranties…).
        - name: why
          label: Why should a customer go solar with you?
          kind: textarea
          required: false
          help: "The three or four reasons that win people over. Use real numbers only if you can back them up. For each: Reason · One sentence."
        - name: services
          label: Which services and system types do you offer?
          kind: textarea
          required: true
          help: "Residential, commercial, agricultural, batteries, ground mounts, service for existing systems. For each: Service · Who it's for · What's involved."
        - name: process
          label: What are the steps from first call to power-on?
          kind: textarea
          required: false
        - name: projects
          label: Which projects would you like to show?
          kind: textarea
          required: false
          help: "A line on each (system size, roof or site type, town). Only real installs. You'll send the photos in the next step. For each: Project · One line about it."
        - name: team
          label: Who's on the team?
          kind: textarea
          required: false
          help: "People customers will meet, with permission. For each: Name · Role."
        - name: incentives
          label: Which incentives, rebates, or financing do you help customers with?
          kind: textarea
          required: false
          help: Only programs that currently apply in your area, with links if you have them. We'll keep the wording careful, since these change often.
        - name: contact-form
          label: What should the quote request form ask?
          kind: text
          required: false
          help: For example property address, system interest, monthly bill.
        - name: contact
          label: How should people reach you?
          kind: textarea
          required: true
          help: Phone, public email, street address (and any directions, like "use the side door"), and the inbox where website messages should go.
        - name: hours
          label: When are you open or available?
          kind: textarea
          required: false
          help: Regular hours, plus anything seasonal or by appointment.
        - name: voice
          label: Which words describe how you want to come across?
          kind: text
          required: false
          help: "Pick up to three, or add your own. For example: Warm, Professional, Playful, Calm, Bold, Straightforward, Neighborly, Expert."
      submitLabel: Send my answers
      successText: Thanks! We have your answers. You'll hear from us by 5pm the next business day with your preview, or a note about anything missing.
  - type: intro
    variant: two-column
    tone: tint
    id: photos
    eyebrow: Next step
    heading: Send your photos and files
    body: After you send your answers, we'll email you a private link to upload your logo, photos, and any documents you listed (reports, forms, menus). Real photos of your people, place, and work beat stock photos every time.
