# Generated from questionnaires/financial.yaml by `npm run questionnaire`. Edit the questionnaire, not this file.
slug: /start/financial
title: Bookkeeper / financial questionnaire | Site by Five
description: "Bookkeeping & financial services website questionnaire: the questions we use to write your site."
noindex: true
chrome:
  announcement: false
  nav:
    minimal: true
    cta: false
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: Start your site · Bookkeeper / financial
    heading: Bookkeeping & financial services website questionnaire
    intro: |-
      These questions give us everything we need to write your site. Short answers are fine; bullet points
      are fine. If you already have a brochure, an old website, or a document that covers some of this,
      email it to hello@sitebyfive.com and skip what it answers. Photos, your logo, and documents come in the next step, so for now just tell us what you have. Anything you leave blank shows up in your preview as a
      clearly marked "add this later" note, never as made-up filler.
  - type: contact
    variant: form
    id: questionnaire
    form:
      subject: "Questionnaire: Bookkeeper / financial"
      fields:
        - name: your_name
          label: Your name
          kind: text
          required: true
        - name: email
          label: Email
          kind: email
          required: true
        - name: organization
          label: Organization
          kind: text
          required: true
        - name: basics
          label: What's your organization called, and what do you do, in a sentence or two?
          kind: textarea
          required: true
          help: The way you'd explain it to a neighbor. Include who you serve and where.
        - name: clients
          label: Who do you work with, and what problem do you solve for them?
          kind: textarea
          required: true
          help: The kinds of clients you're best for, and what's different about working with you.
        - name: services
          label: What services do you offer?
          kind: textarea
          required: true
          help: "For each: Service · Who it's for · What's included."
        - name: process
          label: What happens when a new client starts with you?
          kind: textarea
          required: false
          help: Three or four steps, from the first call to ongoing work.
        - name: pricing
          label: How do you price your work?
          kind: textarea
          required: false
          help: "Packages or rates, what's included, and anything billed separately. \"Starting at\" prices are fine. For each: Service or package · Price · Per (month, hour, return…) · What's included."
        - name: questions
          label: What do prospective clients usually ask before hiring you?
          kind: textarea
          required: false
          help: Three to six questions, with your answers.
        - name: team
          label: Who's on your team?
          kind: textarea
          required: false
          help: "Only real credentials (CPA, EA, certifications) and only people who've agreed to be listed. For each: Name · Role · Credentials · One or two sentences."
        - name: resources
          label: Which resources, forms, or links should clients be able to find?
          kind: textarea
          required: false
          help: "Client portal, document checklists, payment links, deadline calendars, required disclosures. For each: Name · Link (if online) · One line about it."
        - name: contact-form
          label: What should the contact form ask, and how quickly do you reply?
          kind: textarea
          required: false
        - name: contact
          label: How should people reach you?
          kind: textarea
          required: true
          help: Phone, public email, street address (and any directions, like "use the side door"), and the inbox where website messages should go.
        - name: hours
          label: When are you open or available?
          kind: textarea
          required: false
          help: Regular hours, plus anything seasonal or by appointment.
        - name: voice
          label: Which words describe how you want to come across?
          kind: text
          required: false
          help: "Pick up to three, or add your own. For example: Warm, Professional, Playful, Calm, Bold, Straightforward, Neighborly, Expert."
        - name: plan
          label: Which plan would you like?
          kind: select
          required: false
          options:
            - Monthly ($49/month)
            - Yearly ($490/year)
            - Not sure yet
          help: Both include hosting, SSL, and 30 minutes of edits a month. Setup is $595 ($495 for nonprofits and public districts) either way.
        - name: domain
          label: Do you already have a domain name? If so, what is it, and where is it registered?
          kind: text
          required: false
          help: For example "maplewoodschool.org, at GoDaddy". If you don't have one, leave this blank and your site can launch at yourname.sitebyfive.com. Connecting your own domain is a $95 add-on.
      submitLabel: Send my answers
      successText: "Thanks, your answers are in! Within one business day we'll email you three things: a Dropbox link for your logo, photos, and documents (or just reply with them attached), your invoice, and any questions about your answers. Once your files are in and the invoice is paid, your site is live by 5pm the next business day."
  - type: intro
    variant: two-column
    tone: tint
    id: photos
    eyebrow: Next step
    heading: Send your photos and files
    body: After you send your answers, we'll email you a private Dropbox link for your logo, photos, and any documents you listed (reports, forms, menus). Or just email them to hello@sitebyfive.com. Real photos of your people, place, and work beat stock photos every time.
