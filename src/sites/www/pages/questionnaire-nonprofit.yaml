# Generated from questionnaires/nonprofit.yaml by `npm run questionnaire`. Edit the questionnaire, not this file.
slug: /start/nonprofit
title: Nonprofit / special district questionnaire | Site by Five
description: "Nonprofit & special district website questionnaire: the questions we use to write your site."
noindex: true
chrome:
  announcement: false
  nav:
    minimal: true
    cta: false
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: Start your site · Nonprofit / special district
    heading: Nonprofit & special district website questionnaire
    intro: |-
      These questions give us everything we need to write your site. Short answers are fine; bullet points
      are fine. If you already have a brochure, an old website, or a document that covers some of this,
      email it to hello@sitebyfive.com and skip what it answers. Photos, your logo, and documents come in the next step, so for now just tell us what you have. Anything you leave blank shows up in your preview as a
      clearly marked "add this later" note, never as made-up filler.
  - type: contact
    variant: form
    id: questionnaire
    form:
      subject: "Questionnaire: Nonprofit / special district"
      fields:
        - name: your_name
          label: Your name
          kind: text
          required: true
        - name: email
          label: Email
          kind: email
          required: true
        - name: organization
          label: Organization
          kind: text
          required: true
        - name: basics
          label: What's your organization called, and what do you do, in a sentence or two?
          kind: textarea
          required: true
          help: The way you'd explain it to a neighbor. Include who you serve and where.
        - name: mission
          label: Who do you serve, and what do you do for them?
          kind: textarea
          required: true
          help: Your mission in plain words, how long you've been at it, and the people who come to you.
        - name: getting-help
          label: How does someone get help from you?
          kind: textarea
          required: true
          help: Who qualifies, what to bring, where to go, and what happens on a first visit.
        - name: help-questions
          label: What do people usually ask before they come?
          kind: textarea
          required: false
          help: Three to six questions, with your answers.
        - name: events
          label: Do you hold regular events or special distributions?
          kind: textarea
          required: false
          help: We'll list them with dates as they're scheduled.
        - name: ways-to-help
          label: How can people help?
          kind: textarea
          required: true
          help: "Volunteer roles (and when they happen), drives, in-kind donations, and giving money. For each: Way to help · When or how · One sentence."
        - name: giving
          label: How should people donate, and what does a gift make possible?
          kind: textarea
          required: false
          help: Your donation link or mailing address, tax status, and real examples like "$25 fills two grocery bags". Also any most-needed items list.
        - name: story
          label: What's your story, and who governs the organization?
          kind: textarea
          required: false
          help: How you started and how you work today. Board or leadership names and roles, with permission.
        - name: public-body
          label: Are you a special district or other public body?
          kind: text
          required: false
          help: "For example a water, fire, park, or metropolitan district. If so, tell us which laws you follow for posting meetings and records, and we'll give them a clear home on the site. For example: No, Special district, Other public body."
        - name: meetings
          label: When and where does your board meet?
          kind: textarea
          required: false
          help: Your regular schedule and location, whether the public can attend or comment, and where agendas are posted. We'll list upcoming meetings with dates.
        - name: documents
          label: Which public documents should be on the site?
          kind: textarea
          required: false
          help: "Annual reports, budgets, audits, financials, determination letter, agendas, minutes, election notices. List them here; you'll send the files in the next step. For each: Document · One line about it."
        - name: accessibility
          label: Who should people contact about accessibility?
          kind: text
          required: false
          help: A name, email, or phone for anyone who has trouble using the site or needs a document in another format. It goes on your accessibility statement.
        - name: contact-form
          label: What should the contact form ask about?
          kind: text
          required: false
        - name: contact
          label: How should people reach you?
          kind: textarea
          required: true
          help: Phone, public email, street address (and any directions, like "use the side door"), the towns or area you serve, and the inbox where website messages should go.
        - name: hours
          label: When are you open or available?
          kind: textarea
          required: false
          help: 'Regular hours, plus anything seasonal ("June–Oct: daily 9–6"), after-hours or emergency lines, and by appointment.'
        - name: voice
          label: Which words describe how you want to come across?
          kind: text
          required: false
          help: "Pick up to three, or add your own. For example: Warm, Professional, Playful, Calm, Bold, Straightforward, Neighborly, Expert."
        - name: plan
          label: Which plan would you like?
          kind: select
          required: false
          options:
            - Monthly ($49/month)
            - Yearly ($490/year)
            - Not sure yet
          help: Both include hosting, SSL, and 30 minutes of edits a month. Setup is $595 ($495 for nonprofits and special districts) either way.
        - name: domain
          label: Do you already have a domain name? If so, what is it, and where is it registered?
          kind: text
          required: false
          help: For example "maplewoodschool.org, at GoDaddy". If you don't have one, leave this blank and your site can launch at yourname.sitebyfive.com. Connecting your own domain is a $95 add-on.
      submitLabel: Send my answers
      successText: "Thanks, your answers are in! Within one business day we'll email you three things: a Dropbox link for your logo, photos, and documents (or just reply with them attached), your invoice, and any questions about your answers. Once your files are in and the invoice is paid, your site is live by 5pm the next business day."
  - type: intro
    variant: two-column
    tone: tint
    id: photos
    eyebrow: Next step
    heading: Send your photos and files
    body: After you send your answers, we'll email you a private Dropbox link for your logo, photos, and any documents you listed (reports, forms, menus). Or just email them to hello@sitebyfive.com. Real photos of your people, place, and work beat stock photos every time.
