slug: /for
title: Who it's for | Site by Five
description: Websites for all kinds of small businesses, with ready page plans and live examples for nonprofits and special districts, property managers, home services and trades, farms, outdoor guides, and early education.
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: Who it's for
    heading: A head start for your kind of business.
    intro: Site by Five works for almost any small business. These six get a ready-made page plan, their own questions, and a live example to start from. Not on the list? Pick the closest; every page can change.

  - type: cards
    variant: icon
    columns: 3
    items:
      - { icon: hand-heart, title: Nonprofits & special districts, body: "Food pantries, community groups, and water, fire, park, and metro districts. Accessible, with a home for board meetings and records.", link: { label: Sites for nonprofits, href: /for/nonprofits } }
      - { icon: key-round, title: Property management, body: "Property managers, caretakers, and home-watch services. Services, an owner portal link, and owner testimonials.", link: { label: Sites for property managers, href: /for/property } }
      - { icon: wrench, title: Home services & trades, body: "Plumbers, electricians, HVAC, landscapers, and snow removal. A call button on every page and your service area.", link: { label: Sites for trades, href: /for/trades } }
      - { icon: apple, title: Farms & local food, body: "Orchards, farm stands, wineries, ranches, and CSAs. Seasonal hours, what's fresh, and events.", link: { label: Sites for farms, href: /for/farms } }
      - { icon: fish, title: Outdoor guides & outfitters, body: "Fly fishing, rafting, hunting, and backcountry trips. Trips and prices with a Book button to your booking software.", link: { label: Sites for outfitters, href: /for/outdoor } }
      - { icon: graduation-cap, title: Early education & schools, body: "Preschools, daycares, Montessori and Waldorf schools, charter schools, and tutoring centers.", link: { label: Sites for schools, href: /for/schools } }

  - type: cta
    variant: simple
    tone: tint
    heading: Don't see your business? It still fits.
    body: "We build for all kinds of small businesses: salons and spas, restaurants and food trucks, brick-and-mortar retail, auto repair and car care, and much more. Tell us what you do and we'll start from the closest plan."
    ctas:
      - { label: Start your site, href: /start, style: primary }
