slug: /for/nonprofits
title: "Nonprofits & special districts | Site by Five"
description: "Websites for nonprofits and special districts: built to WCAG 2.1 AA, with a clear home for board meetings, agendas, minutes, and budgets. We handle the edits. Live by 5pm the next business day."
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: "For nonprofits & special districts"
    heading:
      text: "Help people find you. Then help them help you."
      accent: "help them help you."
    intro: "Food pantries, community groups, and foundations, plus water, fire, park, and metropolitan districts. Tight budgets and volunteer boards, with no time to babysit a website. We handle it."
    breadcrumbs: true

  - type: intro
    variant: two-column
    eyebrow: Why it works
    heading: Built around what your visitors need
    body: "People come to your site with one of two questions: how do I get help, and how can I help? We answer the first one first, then make volunteering and giving easy. Public records and board information have a clear home too."

  - type: featureRows
    tone: tint
    items:
      - label: "Live example · Muted"
        title: "Alder Springs Food Share"
        body: "A real site built with Site by Five, using this plan. Click around: yours starts from the same structure, with your words, photos, colors, and logo."
        image: { src: examples/aldersprings.png, alt: "The Alder Springs Food Share home page" }
        link: { label: Visit the example, href: "https://aldersprings.sitebyfive.com", style: text }

  - type: features
    variant: list
    eyebrow: Your pages
    heading: The page plan
    intro: "This plan has six pages plus an accessibility statement."
    items:
      - { title: "Home", body: "Who you serve, how to get help, and the ways to give." }
      - { title: "Get help", body: "Eligibility, what to bring, hours, location, and common questions." }
      - { title: "Volunteer", body: "Roles, schedules, food or donation drives, and a sign-up form." }
      - { title: "Donate", body: "Your giving link, what a gift does, and most-needed items." }
      - { title: "About", body: "Your story, your board, upcoming board meetings, and public documents." }
      - { title: "Contact", body: "A form and your details." }
      - { title: "Accessibility", body: "Your accessibility statement and how to request another format." }

  - type: faq
    variant: split
    tone: tint
    eyebrow: Questions
    heading: "For nonprofits & special districts"
    items:
      - { q: "Is it accessible enough for a public body?", a: "Every site is built to WCAG 2.1 AA: semantic headings, readable contrast, keyboard-friendly menus and forms, and alt text on every photo. We review accessibility on every page before launch." }
      - { q: "Can we post meeting notices, agendas, minutes, and budgets?", a: "Yes. Upcoming board meetings are listed by date, and documents are listed with short descriptions. Email us the PDF and we'll post it; that counts toward your monthly edits." }
      - { q: "Our board changes every year. Who maintains the site?", a: "We do. There's no login to hand over and no software to update. When officers change, send us the new names." }
      - { q: "Do you work with our donation platform?", a: "Yes. We link your existing giving page (Givebutter, PayPal, a bank, or anything else). We don't take a cut." }
      - { q: "Is there a discount?", a: "Yes. Setup is $495 instead of $595 for registered nonprofits and special districts. See pricing." }

  - type: cta
    variant: simple
    tone: inverse
    heading: Order today. Live by five tomorrow.
    ctas:
      - { label: Start your site, href: /start/nonprofit, style: primary }
      - { label: See pricing, href: /pricing, style: secondary }
