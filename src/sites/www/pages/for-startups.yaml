slug: /for/startups
title: "Startups | Site by Five"
description: "Five-page websites for startups: a ready page plan, a live example, and a real developer's review. Live by 5pm the next business day."
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: "For startups"
    heading:
      text: "Launch the website before the product."
      accent: "before the product."
    breadcrumbs: true

  - type: intro
    variant: two-column
    eyebrow: Why it works
    heading: Built around what your visitors need
    body: "You need a credible site for investors, pilot customers, and hires this week, not a branding project. Your site explains the problem, the product, and how to get started, with a landing page for your pilot or waitlist. We're especially glad to work with western Colorado founders."

  - type: featureRows
    tone: tint
    items:
      - label: "Live example · Bright"
        title: "Lattice Current"
        body: "A real site built with Site by Five, using this plan. Click around: yours starts from the same structure, with your words, photos, colors, and logo."
        image: { src: examples/lattice.png, alt: "The Lattice Current home page" }
        link: { label: Visit the example, href: "https://lattice.sitebyfive.com", style: text }

  - type: features
    variant: list
    eyebrow: Your pages
    heading: The page plan
    intro: "Optional news posts are included at no extra cost."
    items:
      - { title: "Home", body: "The problem, the product, and how customers get started." }
      - { title: "Product", body: "What it does, how it works, and the questions prospects ask." }
      - { title: "Use cases", body: "Who uses it and for what." }
      - { title: "Pilot", body: "A focused landing page with steps, pricing, and a sign-up form." }
      - { title: "Company", body: "Team, story, and contact." }

  - type: faq
    variant: split
    tone: tint
    eyebrow: Questions
    heading: "For startups"
    items:
      - { q: "We're pre-launch. Is that okay?", a: "Yes. Many startups use the Pilot page as a waitlist and fill in the rest as the product matures." }
      - { q: "Can we change it often?", a: "Thirty minutes of edits a month covers most pre-launch changes. Bigger rewrites are quoted first." }
      - { q: "Can it match our brand?", a: "Yes: your colors, fonts, and logo on top of the look you choose. Unusual needs, like a spec sheet, can be built as custom work." }

  - type: cta
    variant: simple
    tone: inverse
    heading: Order today. Live by five tomorrow.
    ctas:
      - { label: Start your site, href: /start, style: primary }
      - { label: See pricing, href: /pricing, style: secondary }
