# Preview frame for the home page look switcher. Forced to the business preset in config.ts.
slug: /preview/business
title: Preview (business) | Site by Five
noindex: true
chrome: false
blocks:
  - type: hero
    variant: split
    eyebrow: Red Butte Valley · since 2009
    heading:
      text: Plumbing and heating, done right.
      accent: right
    body: Leaks, clogs, water heaters, and furnaces. A straight price before we start, a clean job when we leave, and a plumber who answers at 2am.
    image:
      src: preview/hero-van-driveway.jpg
      alt: A plumbing service van in the driveway of a ranch house, a plumber carrying a toolbox to the door
