    heading: Plumbing and heating, start to finish
    items:
      - { title: Water heaters, body: "Tank and tankless, repaired or replaced, usually the same day.", image: { src: preview/service-water-heater.jpg, alt: A new water heater in a clean utility closet }, link: { label: Water heaters, href: "#" } }
      - { title: Furnaces and boilers, body: "Tune-ups before winter and repairs when it counts.", image: { src: preview/service-furnace.jpg, alt: A technician checking the burners of a gas furnace }, link: { label: Heating, href: "#" } }

  - type: cta
