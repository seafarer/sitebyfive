# Ellsworth & Pine Advisory — fictional wealth adviser.
# Preset: business. Images: none at all. This is the thin-content fixture: every
# block here is chosen to look finished with words alone.
# Shows: text-only hero, text cards, feature rows without images, text-badge logos,
# team list, link list split, events list, pricing list, simple footer, sidebar posts.

name: Ellsworth & Pine Advisory
url: https://ellsworth.sitebyfive.com
locale: en-US

theme:
  preset: business
  colors:
    primary: "#173D36"
    accent: "#B58A4A"
    neutral: "#303936"
  radius: none
  density: standard

organization:
  type: FinancialService
  legalName: Ellsworth & Pine Advisory, LLC
  description: Independent, fee-only financial planning and investment counsel for families, professionals, and trustees.
  email: advisory@ellsworthpine.example
  phone: +1 303 555 0182
  address:
    street: 901 Franklin Street, Suite 410
    locality: Denver
    region: CO
    postalCode: "80206"
    country: US
  openingHours:
    - Mo-Th 08:30-17:00
    - Fr 08:30-15:00
  foundingYear: "2009"

announcement:
  variant: bar
  text: Year-end planning appointments are now available for current clients.
  link: { label: Schedule a review, href: /contact }
  dismissible: true
  tone: muted

nav:
  layout: logo-left
  style: solid
  sticky: true
  wordmark: Ellsworth & Pine
  items:
    - { label: Services, href: /services }
    - { label: Our team, href: /team }
    - { label: Insights, href: /insights }
    - { label: Resources, href: /resources }
    - { label: Contact, href: /contact }
  cta: { label: Start a conversation, href: /contact, style: primary }

footer:
  variant: simple
  blurb: Independent, fee-only financial planning and investment counsel for families, professionals, and trustees. 901 Franklin Street, Suite 410, Denver, CO 80206.
  columns:
    - heading: Advisory
      lines:
        - { label: Services, href: /services }
        - { label: Our team, href: /team }
        - { label: Insights, href: /insights }
        - { label: Client portal, href: https://portal.ellsworthpine.example }
        - { label: Contact, href: /contact }
  social:
    - { network: linkedin, href: https://www.linkedin.com/company/ellsworth-pine-demo }
  legal:
    - © {year} Ellsworth & Pine Advisory, LLC.
    - Fictional demonstration only; no investment advisory services are offered. Investing involves risk, including possible loss of principal.
    - { label: Disclosures, href: /resources#disclosures }

posts:
  enabled: true
  basePath: /insights
  label: Insights
  intro: Notes on planning, taxes, and the decisions that tend to arrive all at once.
  layout: article-sidebar
  index: list

pages:
  - home
  - services
  - team
  - resources
  - contact
