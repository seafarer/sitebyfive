slug: /contact
title: Contact | Ellsworth & Pine Advisory
description: Request an introductory conversation with our advisory team.
blocks:
  - type: pageHeader
    variant: simple
    breadcrumbs: true
    eyebrow: Contact
    heading:
      text: Start with a conversation.
      accent: conversation.

  - type: contact
    variant: form-details
    id: contact
    heading: Tell us what deserves clearer thinking.
    intro: Your note goes directly to our advisory team. We respond within two business days to arrange a private introductory call.
    form:
      action: /api/contact
      subject: Introduction request
      fields:
        - name: name
          label: Name
          kind: text
          required: true
        - name: email
          label: Email
          kind: email
          required: true
        - name: phone
          label: Phone (optional)
          kind: tel
          required: false
        - name: topic
          label: What would you like to discuss?
          kind: select
          required: true
          options:
            - Retirement or transition
            - Equity or business liquidity
            - Inheritance or estate
            - Ongoing wealth management
            - Other
        - name: message
          label: A brief note
          kind: textarea
          required: true
      submitLabel: Request an introduction
      successText: Thank you. A member of our advisory team will respond within two business days.
    details:
      address: 901 Franklin Street, Suite 410, Denver, CO 80206
      phone: +1 303 555 0182
      email: advisory@ellsworthpine.example
      hours:
        - Monday–Thursday · 8:30–5:00
        - Friday · 8:30–3:00
        - Meetings by appointment
      mapHref: https://www.openstreetmap.org/search?query=Franklin%20Street%20Denver

  - type: faq
    variant: split
    tone: muted
    heading: What happens next
    items:
      - q: What happens in the introductory meeting?
        a: We talk about what prompted you to reach out, the decisions in front of you, the people involved, and whether our scope and style fit. No documents needed.
      - q: How long until we have a plan?
        a: Most families have a complete first plan within ten weeks of signing an agreement.
      - q: Can we meet virtually?
        a: Yes. About half our clients live outside Colorado and we meet by video.
