slug: /
title: Ellsworth & Pine Advisory | Clarity for consequential decisions
description: Independent, fee-only financial planning and investment counsel for families, professionals, and trustees.
blocks:
  - type: hero
    variant: text-only
    eyebrow: Independent · Fee-only · Fiduciary
    heading:
      text: Clarity for the decisions that carry forward.
      accent: carry forward.
    body: Ellsworth & Pine brings investments, taxes, estate priorities, and family decisions into one disciplined plan, so you can act with context instead of reacting to noise.
    ctas:
      - { label: Start a confidential conversation, href: /contact, style: primary }
      - { label: How we advise, href: "#approach", style: text }
    meta: Serving a limited number of client families from Denver since 2009

  - type: intro
    variant: centered
    id: approach
    tone: muted
    eyebrow: Our purpose
    heading: Good advice should make the whole picture easier to see.
    body: We begin with your obligations, choices, and definition of enough. Then we build a practical framework for capital, one that can guide today’s decisions, adapt to change, and be understood by the people it’s meant to serve.

  - type: cards
    variant: text
    columns: 2
    id: services
    eyebrow: Integrated counsel
    heading: One plan, considered from every angle
    intro: Our work spans four disciplines, and your lead adviser is accountable for keeping them connected.
    items:
      - title: Financial planning
        subtitle: Decisions before products
        body: Cash flow, retirement, equity compensation, insurance, education, major purchases, and the tradeoffs between them.
        link: { label: Planning services, href: /services }
      - title: Investment management
        subtitle: Evidence over prediction
        body: A tax-aware portfolio aligned to your goals, required return, time horizon, liquidity needs, and capacity for risk.
        link: { label: Investment approach, href: /services }
      - title: Tax coordination
        subtitle: Planning across calendars
        body: Ongoing collaboration with your tax adviser on gains, charitable giving, Roth conversions, and multiyear opportunities.
        link: { label: Tax-aware planning, href: /services }
      - title: Estate and legacy
        subtitle: Intent made operational
        body: Balance-sheet organization, beneficiary reviews, trustee support, family meeting preparation, and coordination with estate counsel.
        link: { label: Legacy planning, href: /services }

  - type: featureRows
    id: clients
    tone: muted
    eyebrow: Who we serve
    heading: Built for complexity, grounded in real life
    startSide: left
    items:
      - label: Families in transition
        title: A steady process when the facts are changing.
        body: Retirement, inheritance, the sale of a business, divorce, or the loss of a spouse can make familiar finances feel uncertain. We set priorities, organize the moving parts, and sequence the decisions.
      - label: Professionals and founders
        title: A plan for wealth that’s concentrated, illiquid, or still being built.
        body: We help clients evaluate equity compensation, manage tax exposure, plan liquidity, and turn professional success into durable personal choices.
      - label: Trustees and multigenerational families
        title: Clear governance around shared capital.
        body: We support investment policy, distributions, beneficiary communication, and coordination among trustees, attorneys, accountants, and family members.

  - type: cards
    variant: numbered
    columns: 3
    tone: inverse
    eyebrow: The advisory rhythm
    heading:
      text: Deliberate from the beginning
      accent: Deliberate
    items:
      - label: 01 · Understand
        title: Establish the full picture
        body: We listen for goals, responsibilities, tensions, and open questions, then organize the facts that shape your decisions.
      - label: 02 · Align
        title: Set a decision framework
        body: Together we agree on priorities, planning assumptions, investment policy, and a clear order of operations.
      - label: 03 · Steward
        title: Review, coordinate, adapt
        body: We monitor the plan, prepare for known decisions, and coordinate with your other professionals as life and markets change.

  - type: stats
    eyebrow: A deliberately focused practice
    items:
      - value: 100%
        label: "fee-only: no commissions, ever"
      - value: 12 mo.
        label: planning calendar, reviewed continuously
      - value: "60"
        label: client families per lead adviser, at most

  - type: logos
    variant: grid
    tone: muted
    eyebrow: Standards we hold ourselves to
    items:
      - name: Fiduciary Standard Pledge
        year: Since 2009
        source: Independent Advisor Alliance
      - name: Fee-Only Practice Registry
        year: Since 2011
        source: Planning Standards Board
      - name: Top Independent Advisers
        year: "2025"
        source: Rocky Mountain Business Journal
      - name: Client Experience Award
        year: "2024"
        source: Wealth Practice Review

  - type: quote
    variant: single
    items:
      - text: They didn’t begin with a portfolio. They began by helping us name what the money needed to do, and what we wanted it to make possible.
        name: Illustrative client perspective
        role: Composite quotation for this fictional demonstration

  - type: cta
    variant: simple
    tone: accent
    heading:
      text: Tell us what deserves clearer thinking.
      accent: clearer thinking.
    body: Your note goes directly to our advisory team. We reply within two business days.
    ctas:
      - { label: Start a conversation, href: /contact, style: primary }
      - { label: Read our insights, href: /insights, style: text }
    details: No documents are needed for a first conversation.
