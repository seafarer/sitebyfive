        email: catherine@ellsworthpine.example
      - name: Marcus Pine
        role: Founding partner · Chief investment officer
        bio: Marcus sets investment policy and oversees portfolio construction. He’s skeptical of forecasts and enthusiastic about rebalancing.
        email: marcus@ellsworthpine.example
      - name: Renée Delacroix
        role: Lead adviser
        bio: Renée works with founders and professionals navigating equity compensation, liquidity events, and concentrated positions.
      - name: Jonah Whitfield
        role: Tax planning specialist
        bio: Jonah coordinates with clients’ accountants on multiyear tax strategy, charitable giving, and Roth conversions.
      - name: Ana Sofía Reyes
        role: Client operations
        bio: Ana keeps accounts, paperwork, and custodial requests moving, and is usually the first person to answer the phone.

