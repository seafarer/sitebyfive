slug: /services
title: Services and fees | Ellsworth & Pine Advisory
description: Financial planning, investment management, tax coordination, and estate support, with a transparent fee schedule.
blocks:
  - type: pageHeader
    variant: simple
    breadcrumbs: true
    eyebrow: Services
    heading:
      text: Advice that starts with the decision, not the product.
      accent: the decision
    intro: Every relationship includes all four disciplines. What changes is where we spend the time.

  - type: intro
    variant: two-column
    heading: What a year with us looks like
    body: |-
      Each client has a **twelve-month planning calendar** built around known decisions: tax deadlines, equity vesting, required distributions, school tuition, trust reviews. We meet at the moments those decisions are made, not on an arbitrary quarterly schedule.

      Between meetings, your lead adviser coordinates with your accountant and attorney so nothing falls between professionals.

  - type: pricing
    variant: list
    tone: muted
    eyebrow: Fees
    heading: One fee, published in advance
    intro: Fees are billed quarterly and cover planning, investment management, and coordination. There are no commissions or product incentives.
    items:
      - name: Planning engagement
        price: $6,500
        unit: one time
        description: A complete plan for families not yet ready for ongoing management.
      - name: Ongoing advisory · first $3M
        price: 0.80%
        unit: per year
        description: Includes planning, investment management, and tax coordination.
        featured: true
      - name: Ongoing advisory · next $7M
        price: 0.50%
        unit: per year
      - name: Ongoing advisory · above $10M
        price: 0.30%
        unit: per year
      - name: Annual minimum
        price: $18,000
        unit: per year
    note: Fictional fee schedule for demonstration. A real adviser’s fees are disclosed in its Form ADV Part 2A.

  - type: faq
    variant: stacked
    eyebrow: Before we meet
    heading: Common questions
    items:
      - q: What does fee-only fiduciary advice mean?
        a: A fee-only adviser is paid by clients rather than product commissions. A fiduciary is expected to act in a client’s best interest. In a real implementation, this language should be reviewed against the firm’s registrations, Form ADV, and actual compensation.
      - q: Do you require a minimum portfolio size?
        a: We use an annual minimum fee rather than an asset threshold. It’s discussed openly in the first conversation.
      - q: Do you replace our attorney or accountant?
        a: No. We identify planning questions, prepare decisions, and coordinate implementation with the legal and tax professionals you choose.
      - q: Who holds our assets?
        a: An independent custodian holds all client assets in your name. We have limited authority to trade and bill fees, nothing more.

  - type: cta
    variant: simple
    tone: inverse
    heading: Not sure which engagement fits?
    body: A thirty-minute call is usually enough to tell.
    ctas:
      - { label: Start a conversation, href: /contact, style: primary }
