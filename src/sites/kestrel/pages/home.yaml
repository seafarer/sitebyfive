slug: /
title: Kestrel Fly & Float | Guided fly fishing on the Upper Colorado
description: Guided fly-fishing float and walk-wade trips on the Upper Colorado River. Gear, lunch, and patient guides included. Beginners welcome. Book online.
chrome:
  nav:
    style: transparent
blocks:
  - type: hero
    variant: full-bleed
    eyebrow: Kremmling, Colorado · since 2011
    heading:
      text: Guided fly fishing on the Upper Colorado.
      accent: the Upper Colorado.
    body: Float and walk-wade trips through the canyon, with rods, waders, flies, and lunch included. First-timers and old hands welcome.
    image:
      src: hero-drift-boat.jpg
      alt: A wooden drift boat on a green river in a red-rock canyon, a guide rowing while an angler casts from the bow
      focal: 50% 55%
    ctas:
      - { label: Book a trip, href: "https://book.kestrelfly.example", style: primary }
      - { label: See trips and prices, href: /trips, style: secondary }
