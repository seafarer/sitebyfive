slug: /pilot
title: Plan a field pilot | Lattice Current
description: Prove dependable power on your hardest site in 90 days, with agreed metrics and a field engineer alongside.
# Landing page: logo + one CTA that jumps to the form; no menu, announcement, or footer.
chrome:
  announcement: false
  footer: false
  nav:
    minimal: true
    cta: { label: Request a pilot, href: "#request", style: primary }
blocks:
  - type: hero
    variant: split
    imageSide: left
    eyebrow: Field pilot program
    heading:
      text: Prove it on your hardest site in 90 days.
      accent: 90 days
    body: We agree the metrics up front, deploy alongside your crew, and hand you a closeout report you can take to finance.
    image:
      src: pilot-hero-commissioning.jpg
      alt: A Lattice field engineer commissioning an LC-80 with a site operator
      focal: 40% 50%
    ctas:
      - { label: Request a site review, href: "#request", style: primary }
      - { label: See pricing, href: "#pricing", style: text }
    meta: Lattice Current · Austin, Texas

  - type: cards
    variant: numbered
    columns: 4
    tone: muted
    heading: How a pilot runs
    items:
      - title: Site review
        body: A call and a data request. We tell you honestly whether a pilot makes sense.
      - title: Model and plan
        body: A configuration, deployment plan, and the metrics we’ll be judged on.
      - title: Deploy
        body: Delivery, commissioning, and operator training, usually within a week.
      - title: Close out
        body: Ninety days of monitoring, then a report against the agreed metrics.

  - type: pricing
    variant: tiers
    id: pricing
    eyebrow: Pilot pricing
    heading: Clear terms before anything ships
    items:
      - name: Site review
        price: Free
        description: For teams exploring whether storage fits.
        features:
          - Load and source review
          - Configuration recommendation
          - Indicative payback estimate
        cta: { label: Start a review, href: "#request", style: secondary }
      - name: Field pilot
        price: $48k
        unit: / 90 days
        description: One LC-80, fully supported.
        features:
          - Delivery and commissioning
          - Operator training
          - Remote monitoring
          - Closeout report
          - Credit toward purchase
        featured: true
        cta: { label: Plan a pilot, href: "#request", style: primary }
      - name: Fleet program
        price: Custom
        description: Multiple sites or units.
        features:
          - Standardized site kits
          - Volume pricing
          - Dedicated field engineer
        cta: { label: Talk to us, href: "#request", style: secondary }
    note: Fictional pricing for demonstration. Freight outside the continental US is quoted separately.

  - type: faq
    variant: stacked
    heading: Pilot questions
    items:
      - q: What if the pilot doesn’t hit the metrics?
        a: You keep the report and owe nothing beyond the pilot fee. We’d rather learn that early than sell you the wrong system.
      - q: Does the pilot fee count toward a purchase?
        a: Yes. The full fee is credited if you buy within six months of closeout.
      - q: Who operates the unit during the pilot?
        a: Your crew, with our field engineer on call. Training happens during commissioning.

  - type: contact
    variant: form
    id: request
    tone: inverse
    eyebrow: Request a site review
    heading: Tell us about the site.
    intro: A field engineer will reply within two business days.
    form:
      action: /api/contact
      subject: Pilot site review request
      fields:
        - name: name
          label: Name
          kind: text
          required: true
        - name: email
          label: Work email
          kind: email
          required: true
        - name: organization
          label: Organization
          kind: text
          required: true
        - name: application
          label: Application
          kind: select
          required: true
          options:
            - Remote operations
            - Resilience
            - Fleet charging
            - Something else
        - name: message
          label: What does the site need?
          kind: textarea
          required: true
      submitLabel: Request a site review
      successText: Thanks. A field engineer will be in touch within two business days.
