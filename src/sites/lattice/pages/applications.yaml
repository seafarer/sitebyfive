slug: /applications
title: Applications | Lattice Current
description: "Remote operations, resilience, and mobile charging: where the LC-80 earns its keep."
blocks:
  - type: pageHeader
    variant: simple
    breadcrumbs: true
    eyebrow: Applications
    heading:
      text: Built for sites that change faster than infrastructure.
      accent: faster
    intro: Three families of work account for most deployments. The hardware is the same; the configuration is what changes.

  - type: cards
    variant: image
    columns: 3
    items:
      - label: Remote operations
        tag: Most deployed
        title: Research and monitoring
        body: Cut generator hours at field stations, telemetry sites, and survey camps.
        image:
          src: use-research-station.jpg
          alt: A remote research station with an LC-80 and a small wind turbine
        link: { label: Remote configurations, href: /applications }
      - label: Resilience
        title: Clinics, shelters, water
        body: Island critical loads during outages and know exactly how long you can run.
        image:
          src: use-water-plant.jpg
          alt: An LC-80 behind a fence at a municipal water pump station
        link: { label: Resilience deployments, href: /applications }
      - label: Fleet electrification
        tag: New
        title: Temporary charging
        body: Stand up charging for vehicles and equipment wherever the work is this month.
        image:
          src: use-fleet-yard.jpg
          alt: Electric bucket trucks lined up at LC-80 charging points
        link: { label: Mobile charging, href: /applications }

  - type: featureRows
    tone: muted
    heading: What changes by application
    startSide: left
    items:
      - label: Remote
        title: Fuel is the cost you’re really managing.
        body: Remote configurations pair the LC-80 with solar and an existing generator. The controller runs the generator only at its efficient load, then lets the battery carry the rest.
      - label: Resilience
        title: Runtime is the number that matters.
        body: Resilience configurations reserve capacity for critical circuits and publish a live runtime forecast to the people who need to plan around it.
      - label: Fleets
        title: Peak demand is the bill you avoid.
        body: Charging configurations fill the battery slowly from whatever service is available, then deliver fast charging without triggering demand charges.

  - type: quote
    variant: grid
    eyebrow: From the field
    heading: What operators tell us
    items:
      - text: We cut generator runtime by more than half in the first month, and the crew stopped hauling fuel on weekends.
        name: Dana Okafor
        role: Field operations lead · fictional testimonial
      - text: During the ice storm, the clinic never noticed the grid was gone. That’s the whole review.
        name: Luis Ferreira
        role: Facilities director · fictional testimonial
      - text: We moved charging three times in one season. Try doing that with a utility upgrade.
        name: Priya Raman
        role: Fleet manager · fictional testimonial

  - type: cta
    variant: split
    tone: inverse
    heading:
      text: Not sure which configuration fits?
      accent: fits
    body: Most sites are a blend. Tell us about the work and we’ll recommend a starting point.
    ctas:
      - { label: Plan a pilot, href: /pilot, style: primary }
    details: |-
      **Typical response**  
      Within two business days, from an engineer, not a sales queue.
