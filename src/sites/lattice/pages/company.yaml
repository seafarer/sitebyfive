slug: /company
title: Company | Lattice Current
description: The people building deployable power in Austin, Texas, and where to meet them.
blocks:
  - type: pageHeader
    variant: simple
    breadcrumbs: true
    eyebrow: Company
    heading: Engineers who got tired of waiting for the grid.

  - type: intro
    variant: two-column
    heading: Why we started
    body: |-
      Lattice Current began in 2021 with a hospital generator that failed during a winter storm. The founders had spent their careers building utility-scale storage, and the question was obvious: why does dependable power still take a construction project?

      Today the team designs, tests, and assembles every LC-80 in Austin, and a field engineer goes out with every first deployment.

