slug: /
title: Lattice Current | Deployable power for demanding places
description: Lattice Current builds modular energy hardware for remote operations, resilient sites, and fast-moving field teams.
chrome:
  nav:
    style: transparent
blocks:
  - type: hero
    variant: full-bleed
    eyebrow: Deployable energy systems
    heading:
      text: Power that lands where the grid can’t.
      accent: that lands
    body: Compact energy hardware for remote operations, resilient sites, and fast-moving teams. Drop it in, connect your sources, and put dependable power to work in hours—not months.
    image:
      src: home-hero-field.jpg
      alt: An LC-80 power cabinet beside a temporary solar array at a remote desert site at dusk
      focal: 60% 55%
    ctas:
      - { label: Plan a field pilot, href: /pilot, style: primary }
      - { label: Explore the platform, href: /platform, style: secondary }
    meta: Designed, tested, and assembled in Austin, Texas

  - type: logos
    variant: marquee
    tone: default
    eyebrow: Deployed with teams at
    items:
      - name: Northfield Utilities
        logo:
          src: partners/northfield.svg
          alt: Northfield Utilities
      - name: Basin Research Consortium
        logo:
          src: partners/basin.svg
          alt: Basin Research Consortium
      - name: Redline Events
        logo:
          src: partners/redline.svg
          alt: Redline Events
      - name: Cascade Water District
        logo:
          src: partners/cascade.svg
          alt: Cascade Water District
      - name: Ironwood Builders
        logo:
          src: partners/ironwood.svg
          alt: Ironwood Builders
      - name: Field Hospital Alliance
        logo:
          src: partners/fha.svg
          alt: Field Hospital Alliance

  - type: stats
    id: proof
    tone: accent
    eyebrow: The LC-80 at a glance
    heading: Serious power. Small footprint.
    items:
      - value: 80 kWh
        label: usable modular storage
      - value: 30 min
        label: typical physical deployment
      - value: IP55
        label: sealed for dust, rain, and −20 to 50°C
      - value: 24/7
        label: remote system visibility

  - type: intro
    variant: two-column
    id: platform
    eyebrow: The platform
    heading: One field-ready cabinet. Many ways to make and move energy.
    body: The **LC-80** combines storage, power conversion, controls, and connectivity in a transportable enclosure. Pair it with solar, a generator, the utility, or all three. LatticeOS balances the mix automatically while your team keeps control of the priorities that matter.
    link: { label: See the full platform, href: /platform, style: text }

  - type: cards
    variant: icon
    columns: 3
    tone: muted
    eyebrow: Built as a system
    heading: Everything needed to energize a site
    intro: Hardware, software, and field support designed together, so deployment never turns into an integration project.
    items:
      - title: Rugged by default
        body: Weather-sealed enclosure, forklift pockets, protected connections, and serviceable modules for real field conditions.
        icon: shield-check
      - title: Source-flexible
        body: Blend grid, solar, and generator inputs without rebuilding the site around a single source or vendor.
        icon: plug-zap
      - title: Visible from anywhere
        body: See load, state of charge, fuel displacement, and alerts from a clean operations console.
        icon: radar
    tags:
      label: Standard interfaces
      items:
        - 120/208V
        - 480V option
        - Modbus
        - CAN
        - LTE + satellite-ready

  - type: featureRows
    id: applications
    eyebrow: Applications
    heading: Designed for work that can’t wait on infrastructure
    intro: Start with one unit. Add capacity or generation as the mission grows.
    startSide: right
    items:
      - label: Remote operations
        title: Run instruments, comms, and crews with less fuel logistics.
        body: Hybridize existing generators, absorb intermittent renewables, and keep critical loads stable at research, construction, and monitoring sites.
        image:
          src: app-remote-ops.jpg
          alt: Two field engineers checking an LC-80 cabinet next to a weather research mast
        link: { label: Remote configurations, href: /applications, style: text }
      - label: Resilience
        title: Keep essential facilities online through an outage.
        body: Create an islandable power layer for shelters, clinics, water systems, and operations centers, with clear runtime forecasts before conditions change.
        image:
          src: app-resilience-clinic.jpg
          alt: An LC-80 installed behind a rural health clinic, cables running to the building
        link: { label: Resilience deployments, href: /applications, style: text }
      - label: Fleet electrification
        title: Bring charging to the vehicles instead of waiting for the depot.
        body: Stage temporary charging where routes, projects, or events need it. Shift demand away from peaks and move capacity when the work moves.
        image:
          src: app-fleet-charging.jpg
          alt: Electric utility trucks charging from a pair of LC-80 units in a gravel yard
        link: { label: Mobile charging, href: /applications, style: text }

  - type: cards
    variant: numbered
    columns: 3
    id: how-it-works
    tone: inverse
    eyebrow: A practical path to deployment
    heading:
      text: From site data to live power in three steps
      accent: three steps
    items:
      - label: Step 01
        title: Model the site
        body: Share load, source, runtime, access, and environmental constraints. We return a right-sized configuration and deployment plan.
      - label: Step 02
        title: Prove it in a pilot
        body: Validate performance against agreed metrics with remote monitoring and direct support from our field engineering team.
      - label: Step 03
        title: Scale with confidence
        body: Standardize a repeatable kit, train operators, and add units as sites or loads expand.
    link: { label: How pilots work, href: /pilot, style: secondary }

  - type: quote
    variant: single
    tone: muted
    items:
      - text: Energy infrastructure should move at the speed of the work. Our job is to make dependable power feel like equipment—not a construction project.
        name: Mara Velez
        role: Co-founder and CEO, Lattice Current
        photo:
          src: team/mara-velez.jpg
          alt: Mara Velez

  - type: cta
    variant: with-images
    id: contact
    eyebrow: Bring us the hard site
    heading:
      text: Let’s map the fastest path to dependable power.
      accent: dependable power
    body: Send a load profile, a location, or just the problem. A field engineer will reply with the right next questions.
    ctas:
      - { label: Request a site review, href: /pilot, style: primary }
      - { label: Email field engineering, href: mailto:field@latticecurrent.example, style: text }
    images:
      - src: cta-field-crew.jpg
        alt: A field crew unloading an LC-80 from a flatbed trailer
      - src: cta-cabinet-detail.jpg
        alt: Close-up of the LC-80's sealed connector panel
      - src: cta-console.jpg
        alt: The LatticeOS console on a tablet showing load and state of charge
