# Lattice Current — fictional hardware startup.
# Preset: bright. Images: product and field photography.
# Shows: full-bleed hero under a transparent nav, logo marquee, feature rows with
# images, a custom block, gallery, pricing tiers, a chrome-less landing page, team grid.

name: Lattice Current
url: https://lattice.sitebyfive.com
locale: en-US

theme:
  preset: bright
  colors:
    primary: "#B7FF3C"
    accent: "#1F7A4C"
    neutral: "#17211D"
  radius: soft
  density: airy

organization:
  type: Corporation
  legalName: Lattice Current, Inc.
  description: Modular energy hardware for remote operations, resilient sites, and fast-moving field teams.
  email: hello@latticecurrent.example
  phone: +1 512 555 0148
  address:
    street: 4201 Metric Spur
    locality: Austin
    region: TX
    postalCode: "78758"
    country: US
  foundingYear: "2021"

ogImage:
  src: home-hero-field.jpg
  alt: An LC-80 power cabinet at a remote solar site at dusk

announcement:
  variant: bar
  text: Field pilot applications are open for remote and resilience projects.
  link: { label: Request a site review, href: /pilot }
  dismissible: true
  tone: inverse

nav:
  layout: logo-left
  style: floating
  sticky: true
  logo:
    src: logo-lattice.svg
    alt: ""
    kind: mark
  wordmark: Lattice Current
  items:
    - { label: Platform, href: /platform }
    - { label: Applications, href: /applications }
    - { label: Company, href: /company }
    - { label: Field notes, href: /field-notes }
  cta: { label: Plan a pilot, href: /pilot, style: primary }

footer:
  variant: columns
  blurb: Rugged, modular power hardware for teams working beyond the edge of the grid. Designed and assembled in Austin, Texas.
  columns:
    - heading: Explore
      lines:
        - { label: The LC-80 platform, href: /platform }
        - { label: Applications, href: /applications }
        - { label: Pilot program, href: /pilot }
    - heading: Company
      lines:
        - { label: About, href: /company }
        - { label: Events, href: /company#events }
        - { label: Field notes, href: /field-notes }
    - heading: Austin HQ
      lines:
        - 4201 Metric Spur, Austin, TX 78758
        - { label: hello@latticecurrent.example, href: mailto:hello@latticecurrent.example }
  social:
    - { network: linkedin, href: https://www.linkedin.com/company/lattice-current-demo }
    - { network: youtube, href: https://www.youtube.com/@lattice-current-demo }
  legal:
    - © {year} Lattice Current, Inc.
    - Fictional company and specifications created for demonstration.
    - { label: Privacy, href: /company#privacy }

posts:
  enabled: true
  basePath: /field-notes
  label: Field notes
  intro: Deployment write-ups, engineering notes, and lessons from sites the grid forgot.
  layout: article
  index: cards

pages:
  - home
  - platform
  - applications
  - pilot
  - company
