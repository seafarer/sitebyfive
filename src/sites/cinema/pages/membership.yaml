slug: /membership
title: Membership | The Lantern Picture House
description: Support a 1928 single-screen cinema and see films for $5.
blocks:
  - type: pageHeader
    variant: with-image
    breadcrumbs: true
    eyebrow: Membership
    heading: Keep the lights on. Literally.
    intro: The Lantern is a nonprofit. Members keep it running, and get a very good deal on the way.
    image:
      src: membership-marquee.jpg
      alt: The Lantern's neon marquee lit up at night on Main Street

  - type: pricing
    variant: tiers
    heading: Choose a level
    items:
      - name: Usher
        price: $60
        unit: / year
        features:
          - $5 tickets for one
          - Member newsletter
          - Free popcorn on your birthday
        cta: { label: Join as Usher, href: mailto:members@lanternpicturehouse.example, style: secondary }
      - name: Projectionist
        price: $120
        unit: / year
        features:
          - $5 tickets for two
          - Two free passes
          - Early access to special events
        featured: true
        cta:
          label: Join as Projectionist
          href: mailto:members@lanternpicturehouse.example
          style: primary
      - name: Marquee
        price: $500
        unit: / year
        features:
          - Free tickets for two, all year
          - Your name on the lobby wall
          - Private screening for 20
        cta:
          label: Join as Marquee
          href: mailto:members@lanternpicturehouse.example
          style: secondary
    note: Membership is a tax-deductible donation, minus the value of benefits received.

  - type: faq
    variant: stacked
    tone: muted
    heading: Membership questions
    items:
      - q: Can I give a membership as a gift?
        a: Yes. Email us the recipient's name and we'll send a card.
      - q: Do discounts apply to special events?
        a: Most of them. Galas and live performances are priced separately.
