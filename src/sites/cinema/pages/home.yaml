slug: /
title: The Lantern Picture House | Hood River's single-screen cinema
description: Independent films, repertory classics, and double features in a restored 1928 cinema on Main Street, Hood River.
blocks:
  - type: hero
    variant: full-bleed
    eyebrow: Since 1928 · Main Street, Hood River
    heading:
      text: One screen. Every night worth going out for.
      accent: worth going out for.
    image:
      src: hero-auditorium.webp
      alt: The Lantern's restored auditorium with red velvet seats and a lit proscenium
      focal: 50% 60%
    ctas:
      - { label: See showtimes, href: "#showtimes", style: primary }
      - { label: Become a member, href: /membership, style: secondary }

  - type: cards
    variant: image
    columns: 4
    eyebrow: Now showing
    heading: This week on the big screen
    items:
      - label: Drama · 1h 52m
        title: The Lighthouse Accounts
        image:
          src: posters/lighthouse-accents.webp
          alt: Poster for The Lighthouse Accounts
      - label: Documentary · 1h 34m
        title: Salt & Timber
        tag: Q&A Friday
        image:
          src: posters/salt-timber.webp
          alt: Poster for Salt & Timber
      - label: Comedy · 1h 41m
        title: Second Cousins
        image:
          src: posters/second-cousins.webp
          alt: Poster for Second Cousins
      - label: Repertory · 1962
        title: Night Train to Ostend
        tag: 35mm
        image:
          src: posters/night-train.webp
          alt: Poster for Night Train to Ostend

  - type: events
    variant: list
    id: showtimes
    tone: muted
    eyebrow: Showtimes
    heading: Coming up
