      - title: Salt & Timber, with director Q&A
        date: 2026-10-16
        time: 7:30 pm
        body: Followed by a conversation with director **Mae Holloway**.
        link: { label: Tickets, href: mailto:boxoffice@lanternpicturehouse.example }
      - title: Second Cousins
        date: 2026-10-17
        time: 4:00 & 8:15 pm
        link: { label: Tickets, href: mailto:boxoffice@lanternpicturehouse.example }
      - title: Night Train to Ostend (35mm)
        date: 2026-10-19
        time: 6:30 pm
        body: A rare 35mm print, introduced by our projectionist.
        link: { label: Tickets, href: mailto:boxoffice@lanternpicturehouse.example }
      - title: Halloween double feature
        date: 2026-10-31
        time: 8:00 pm
        body: Two creature features, one intermission, costumes encouraged.
        link: { label: Tickets, href: mailto:boxoffice@lanternpicturehouse.example }
      - title: Silent film with live organ
        date: 2026-11-21
        time: 7:00 pm
        location: With the Lantern’s restored Wurlitzer
        link: { label: Tickets, href: mailto:boxoffice@lanternpicturehouse.example }
