  - type: pricing
    variant: list
    eyebrow: Tickets
    heading: Prices
    items:
      - name: Adult
        price: $12
      - name: Student, senior, or child
        price: $9
      - name: Tuesday screenings
        price: $7
        description: Every screening, every Tuesday.
      - name: Members
        price: $5
        description: Any screening, any day.
        featured: true
    note: Cash and cards accepted. Special events may be priced separately.

  - type: cta
    variant: simple
    tone: tint
    heading:
      text: Members get the best seats in town for five bucks.
      accent: five bucks.
    ctas:
