# The Lantern Picture House — fictional single-screen cinema.
# Preset: warm, with colour overrides only (fonts, radius, density are the preset's).
# The brief's "second business type" check: built entirely from existing blocks,
# no component changes. Showtimes are an events list; tickets are a pricing list.

name: The Lantern Picture House
status: live
url: https://cinema.sitebyfive.com
locale: en-US

theme:
  preset: warm
  colors:
    primary: "#9E2B25"
    accent: "#E8B04B"
    neutral: "#2E2420"

organization:
  type: MovieTheater
  description: A restored 1928 single-screen cinema showing new independent films, repertory classics, and the occasional double feature.
  email: boxoffice@lanternpicturehouse.example
  phone: +1 541 555 0193
  address:
    street: 22 Main Street
    locality: Hood River
    region: OR
    postalCode: "97031"
    country: US
  openingHours:
    - Tu-Su 16:00-23:00
  foundingYear: "1928"

# analytics:
#   - { provider: plausible, domain: lanternpicturehouse.example }

announcement:
  variant: bar
  text: Members see every Tuesday screening for $5.
  link: { label: Become a member, href: /membership }
  tone: inverse

nav:
  layout: logo-left
  style: solid
  sticky: true
  logo:
    src: logo-lantern.svg
    alt: ""
    kind: mark
  wordmark: The Lantern
  items:
    - { label: Now showing, href: /#showtimes }
    - { label: Membership, href: /membership }
    - { label: Visit, href: /visit }
  cta: { label: Tickets, href: /#showtimes, style: primary }

footer:
  variant: columns
  blurb: A restored 1928 single-screen cinema on Main Street. Independent, repertory, and very good popcorn.
  columns:
    - heading: Box office
      lines:
        - Tuesday–Sunday · from 4 pm
        - { label: +1 541 555 0193, href: tel:+15415550193 }
        - label: boxoffice@lanternpicturehouse.example
          href: mailto:boxoffice@lanternpicturehouse.example
    - heading: The Lantern
      lines:
        - { label: Now showing, href: /#showtimes }
        - { label: Membership, href: /membership }
        - { label: Plan your visit, href: /visit }
  social:
    - { network: instagram, href: https://www.instagram.com/lantern.demo }
    - { network: bluesky, href: https://bsky.app/profile/lantern.demo }
  legal:
    - © {year} The Lantern Picture House.
    - A fictional cinema created for demonstration. Film titles are invented.

pages:
  - home
  - membership
  - visit
