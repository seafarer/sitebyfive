slug: /contact
title: Contact | Juniper Plumbing & Heating
description: Request plumbing or heating service online, or call our 24/7 emergency line.
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: Contact
    heading: Request service.
    intro: "For emergencies, call (970) 555-0147. A plumber answers 24/7. For everything else, send the form and we'll call you back within two business hours."

  - type: contact
    variant: form-details
    id: request
    form:
      subject: Service request
      fields:
        - { name: name, label: Your name, kind: text, required: true }
        - { name: phone, label: Phone, kind: tel, required: true, help: We'll call to confirm a time. }
        - { name: email, label: Email, kind: email }
        - { name: address, label: Service address, kind: text, required: true }
        - { name: service, label: What do you need?, kind: select, required: true, options: [A repair, Drain or sewer, Water heater, Furnace or boiler, Remodel estimate, Something else] }
        - { name: when, label: How soon?, kind: select, options: [Today if possible, This week, Whenever suits, Just getting an estimate] }
        - { name: message, label: Tell us what's going on, kind: textarea }
      submitLabel: Request service
      successText: "Thanks! We'll call you within two business hours to set a time. If water is still running, call (970) 555-0147 now."
    details:
      address: 418 Industrial Way, Red Butte, CO 81499
      phone: (970) 555-0147
      email: office@juniperplumbing.example
      hours:
        - "Office: Mon–Fri 7am–6pm, Sat 8am–noon"
        - "Emergency line: 24/7"
