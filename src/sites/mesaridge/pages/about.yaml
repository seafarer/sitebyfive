      - { name: Sam Whitehorse, role: Lead system designer, photo: { src: team/sam.jpg, alt: "Sam Whitehorse, lead designer" } }
      - { name: Priya Nair, role: Energy consultant, photo: { src: team/priya.jpg, alt: "Priya Nair, energy consultant" } }
      - { name: Cody Burke, role: Service manager, photo: { src: team/cody.jpg, alt: "Cody Burke, service manager" } }

