slug: /commercial
title: Commercial solar | Mesa Ridge Solar
description: Solar for farms, wineries, schools, and businesses across the Red Butte Valley, from 20 kW to over a megawatt.
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: Commercial and agricultural
    heading:
      text: Lower operating costs, for decades.
      accent: for decades.
    intro: We design systems around how your operation uses power through the year, from irrigation pumps in July to cold storage in October.

  - type: featureRows
    startSide: right
    items:
      - label: Farms and orchards
        title: Power the pumps, not the utility
        body: "Ground-mount arrays sized to irrigation season, often paired with agricultural grants that cover a large share of the cost."
        image: { src: com-orchard.jpg, alt: Solar rows at the edge of an apple orchard in bloom }
      - label: Wineries and hospitality
        title: Cold rooms, tasting rooms, guest rooms
        body: "Rooftop and carport systems that cover daytime loads and give guests something to talk about."
        image: { src: com-winery.jpg, alt: A solar carport shading cars outside a stone winery building }
      - label: Schools and nonprofits
        title: Savings that go back to the mission
        body: "We help schools and nonprofits with grants and direct-pay incentives, so the savings start on day one."
        image: { src: com-library.jpg, alt: A low brick library with panels across its flat roof }

  - type: stats
    tone: inverse
    eyebrow: Commercial work to date
    items:
      - { value: 140+, label: commercial and farm systems }
      - { value: 9.6 MW, label: installed capacity }
      - { value: 20 yrs, label: servicing what we build }

  - type: gallery
    variant: masonry
    eyebrow: Gallery of work
    heading: Recent projects
    images:
      - { src: gallery/winery-roof.jpg, alt: Panels across the roof of a winery barrel room }
      - { src: gallery/grain-bins.jpg, alt: A ground-mount array beside tall grain bins at dusk }
      - { src: gallery/shelter.jpg, alt: The animal shelter's new array with dogs in the yard below }
      - { src: gallery/inn-carport.jpg, alt: A solar carport at a country inn with mountains behind }
      - { src: gallery/pump-house.jpg, alt: A small array powering an irrigation pump house }
      - { src: gallery/install-crew.jpg, alt: The install crew lifting a panel into place on a commercial roof }

  - type: cta
    variant: simple
    tone: tint
    heading: Talk to a commercial designer.
    body: Send us twelve months of utility bills and we'll come back with a site assessment and a payback estimate, at no cost.
    ctas:
      - { label: Request an assessment, href: /contact, style: primary }
