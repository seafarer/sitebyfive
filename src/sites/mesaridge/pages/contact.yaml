slug: /contact
title: Contact | Mesa Ridge Solar
description: Book a free, no-obligation solar consultation or a service visit.
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: Contact
    heading: Let's talk about your power.

  - type: contact
    variant: form-details
    id: consultation
    heading: Book a free consultation
    intro: Tell us a little about your property. A consultant will call within one business day to set up a time.
    form:
      subject: Consultation request
      fields:
        - { name: name, label: Your name, kind: text, required: true }
        - { name: email, label: Email, kind: email, required: true }
        - { name: phone, label: Phone, kind: tel, required: true }
        - { name: address, label: Property address, kind: text }
        - { name: interest, label: I'm interested in, kind: select, options: [Home solar, Solar plus battery, Commercial or farm, Service for an existing system, Not sure yet] }
        - { name: message, label: Anything else we should know?, kind: textarea }
      submitLabel: Request a consultation
      successText: Thanks! A consultant will call you within one business day.
    details:
      address: 220 Depot Avenue, Red Butte, CO 81499
      phone: +1 970 555 0182
      email: hello@mesaridge.example
      hours:
        - Mon–Fri 8am–5pm
