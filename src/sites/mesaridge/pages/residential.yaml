slug: /residential
title: Residential solar | Mesa Ridge Solar
description: Rooftop, ground-mount, and battery systems for homes in the Red Butte Valley, sized to your real usage.
blocks:
  - type: pageHeader
    variant: with-image
    eyebrow: Residential
    heading: Home solar, sized to how you actually live.
    intro: We start from your last twelve months of bills, not a sales target, and design the smallest system that does the job.
    image:
      src: residential-header.jpg
      alt: A family walking up to their farmhouse, solar panels on the barn roof behind them
      focal: 50% 55%

  - type: featureRows
    items:
      - label: Most popular
        title: Grid-tied rooftop solar
        body: "The simplest way to cut your bill. Panels on your roof feed your home first and send the extra back to the grid for credit."
        image: { src: res-rooftop.jpg, alt: A close-up of black panels on a standing-seam metal roof }
      - label: Backup power
        title: Solar plus battery
        body: "Keep the lights, fridge, and well pump running through an outage, and use more of your own power after dark."
        image: { src: res-battery.jpg, alt: A wall-mounted home battery beside an electrical panel in a tidy garage }
      - label: Space to spare
        title: Ground-mount systems
        body: "No good roof? A ground mount can face due south at the ideal angle, and it's easy to clean in winter."
        image: { src: res-ground-mount.jpg, alt: A row of ground-mounted panels in a pasture with horses grazing nearby }

  - type: cards
    variant: numbered
    columns: 4
    id: steps
    tone: tint
    eyebrow: Steps for going solar
    heading: From first call to first kilowatt
    items:
      - { title: Consultation, body: "We review your bills and roof, and give you honest numbers. About an hour, at your kitchen table or on the phone." }
      - { title: Design and permits, body: "Our designers draw the system; we file every permit and the utility application." }
      - { title: Installation, body: "Most homes take one or two days. Our own crew, never subcontractors." }
      - { title: Power on, body: "After inspection and utility approval, you flip the switch and watch it on the monitoring app." }

  - type: cta
    variant: simple
    heading: See what your roof could do.
    ctas:
      - { label: Get a free consultation, href: /contact, style: primary }
