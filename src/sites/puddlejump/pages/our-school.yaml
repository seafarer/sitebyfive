slug: /our-school
title: Our school | Puddlejump Early School
description: Our philosophy, our teachers, and our two-acre outdoor classroom.
blocks:
  - type: pageHeader
    variant: with-image
    breadcrumbs: true
    eyebrow: Our school
    heading: A small school with a very big backyard.
    image:
      src: school-header.jpg
      alt: The Puddlejump building seen from the garden, with children playing out front

  - type: richText
    eyebrow: What we believe
    heading: Children learn by doing, and by doing it together.
    body: |-
      We’re a play-based school, which means children spend most of the day choosing what to work on. That isn’t the same as anything goes. Teachers set up the room with care, watch closely, and step in with a question, a material, or a hand when it helps.

      We care about the things that predict a good start to school: **curiosity, persistence, friendship, and the ability to manage big feelings.** Letters and numbers come along for the ride, usually inside a project a child already cares about.

      And we go outside every day. Rain, snow, and mud are part of the curriculum.

