# Bookkeeper / financial template. Generated from src/sites/ellsworth by `npm run templates`; edit the demo, not this file.

name: "{{name}}"
status: preview
url: "{{url}}"
locale: en-US

theme:
  preset: "{{preset}}"

organization:
  type: FinancialService
  legalName: '[[Add: legal name, e.g. "Ellsworth & Pine Advisory, LLC"]]'
  description: "[[Add: description, about 10 words]]"
  email: '[[Add: public email, e.g. "advisory@ellsworthpine.example"]]'
  phone: '[[Add: phone, e.g. "+1 303 555 0182"]]'
  address:
    street: '[[Add: street, e.g. "901 Franklin Street, Suite 410"]]'
    locality: '[[Add: town, e.g. "Denver"]]'
    region: '[[Add: state, e.g. "CO"]]'
    postalCode: '[[Add: postal code, e.g. "80206"]]'
    country: '[[Add: country code, e.g. "US"]]'
  openingHours:
    - '[[Add: opening hours, e.g. Mo-Fr 09:00-17:00, e.g. "Mo-Th 08:30-17:00"]]'
    - '[[Add: opening hours, e.g. Mo-Fr 09:00-17:00, e.g. "Fr 08:30-15:00"]]'

nav:
  layout: logo-left
  style: solid
  sticky: true
  items:
    - { label: Services, href: /services }
    - { label: Our team, href: /team }
    - { label: Insights, href: /insights }
    - { label: Resources, href: /resources }
    - { label: Contact, href: /contact }
  cta: { label: Start a conversation, href: /contact, style: primary }

footer:
  variant: simple
  blurb: "[[Add: one or two sentences about the organisation, about 20 words]]"
  columns:
    - heading: '[[Add: heading, e.g. "Advisory"]]'
      lines:
        - { label: Services, href: /services }
        - { label: Our team, href: /team }
        - { label: Insights, href: /insights }
        - '[[Add: footer line, e.g. "Client portal"]]'
        - { label: Contact, href: /contact }
  legal:
    - "© {year} {{name}}."

posts:
  enabled: true
  basePath: /insights
  label: Insights
  intro: "[[Add: intro, about 15 words]]"
  layout: article-sidebar
  index: list

pages:
  - home
  - services
  - team
  - resources
  - contact
