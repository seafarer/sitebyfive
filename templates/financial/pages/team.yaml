    variant: simple
    breadcrumbs: true
    eyebrow: '[[Add: eyebrow, e.g. "Our team"]]'
    heading: '[[Add: heading, e.g. "Small enough to know your plan by name."]]'
    intro: "[[Add: intro, about 20 words]]"

  - type: team
    variant: list
    tone: default
    people:
      - name: '[[Add: name, e.g. "Catherine Ellsworth"]]'
        role: '[[Add: role, e.g. "Founding partner · Lead adviser"]]'
        bio: "[[Add: bio, about 20 words]]"
        email: '[[Add: public email, e.g. "catherine@ellsworthpine.example"]]'
      - name: '[[Add: name, e.g. "Marcus Pine"]]'
        role: '[[Add: role, e.g. "Founding partner · Chief investment officer"]]'
        bio: "[[Add: bio, about 15 words]]"
        email: '[[Add: public email, e.g. "marcus@ellsworthpine.example"]]'
      - name: '[[Add: name, e.g. "Renée Delacroix"]]'
        role: '[[Add: role, e.g. "Lead adviser"]]'
        bio: "[[Add: bio, about 15 words]]"
      - name: '[[Add: name, e.g. "Jonah Whitfield"]]'
        role: '[[Add: role, e.g. "Tax planning specialist"]]'
        bio: "[[Add: bio, about 15 words]]"
      - name: '[[Add: name, e.g. "Ana Sofía Reyes"]]'
        role: '[[Add: role, e.g. "Client operations"]]'
        bio: "[[Add: bio, about 20 words]]"

  - type: cta
    variant: split
    tone: muted
    heading: '[[Add: heading, e.g. "Meet us before you decide anything."]]'
    body: '[[Add: body text, e.g. "An introductory call is free and carries no obligation."]]'
    ctas:
      - { label: '[[Add: label, e.g. "Request an introduction"]]', href: /contact, style: primary }
    details: '[[Add: details, e.g. "**Office hours** Monday–Thursday, 8:30–5:00 Friday, 8:30–3:00"]]'
