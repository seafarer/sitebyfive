# Bookkeeper / financial template. Generated from src/sites/ellsworth by `npm run templates`; edit the demo, not this file.

slug: /resources
title: "Client resources | {{name}}"
description: '[[Add: description, e.g. "Client portal, disclosures, upcoming seminars, and documents."]]'
blocks:
  - type: pageHeader
    variant: simple
    breadcrumbs: true
    eyebrow: '[[Add: eyebrow, e.g. "Resources"]]'
    heading: '[[Add: heading, e.g. "Everything clients ask us to find."]]'

  - type: linkList
    variant: split
    eyebrow: '[[Add: eyebrow, e.g. "Client links"]]'
    heading: '[[Add: heading, e.g. "Portals and documents"]]'
    intro: '[[Add: intro, e.g. "The portal is where statements, reports, and secure messages live."]]'
    items:
      - label: '[[Add: label, e.g. "Client portal"]]'
        href: https://portal.{{id}}pine.example
        description: '[[Add: description, e.g. "Statements, performance reports, and secure messaging."]]'
      - label: '[[Add: label, e.g. "Custodian login"]]'
        href: https://custodian.example
        description: '[[Add: description, e.g. "Direct access to your accounts at our independent custodian."]]'
      - label: '[[Add: label, e.g. "Form ADV Part 2A"]]'
        href: /disclosures/form-adv.pdf
        description: '[[Add: description, e.g. "Our firm brochure: services, fees, and conflicts of interest."]]'
      - label: '[[Add: label, e.g. "Form CRS"]]'
        href: /disclosures/form-crs.pdf
        description: '[[Add: description, e.g. "A two-page relationship summary."]]'
      - label: '[[Add: label, e.g. "Privacy notice"]]'
        href: "#disclosures"
        description: '[[Add: description, e.g. "How we collect, use, and protect client information."]]'

  - type: events
    variant: list
    tone: muted
    eyebrow: '[[Add: eyebrow, e.g. "Client seminars"]]'
    heading: '[[Add: heading, e.g. "Upcoming conversations"]]'
    intro: "[[Add: intro, about 10 words]]"
    items: []

  - type: richText
    id: disclosures
    width: prose
    eyebrow: '[[Add: eyebrow, e.g. "Disclosures"]]'
    heading: '[[Add: heading, e.g. "Important information"]]'
    body: "[[Add: body text, about 95 words]]"
