# Bookkeeper / financial template. Generated from src/sites/ellsworth by `npm run templates`; edit the demo, not this file.

slug: /contact
title: "Contact | {{name}}"
description: '[[Add: description, e.g. "Request an introductory conversation with our advisory team."]]'
blocks:
  - type: pageHeader
    variant: simple
    breadcrumbs: true
    eyebrow: '[[Add: eyebrow, e.g. "Contact"]]'
    heading: '[[Add: heading, e.g. "Start with a conversation."]]'

  - type: contact
    variant: form-details
    id: contact
    heading: '[[Add: heading, e.g. "Tell us what deserves clearer thinking."]]'
    intro: "[[Add: intro, about 20 words]]"
    form:
      action: /api/contact
      subject: '[[Add: subject, e.g. "Introduction request"]]'
      fields:
        - { name: name, label: Name, kind: text, required: true }
        - { name: email, label: Email, kind: email, required: true }
        - { name: phone, label: Phone (optional), kind: tel, required: false }
        - name: topic
          label: What would you like to discuss?
          kind: select
          required: true
          options:
            - '[[Add: option, e.g. "Retirement or transition"]]'
            - '[[Add: option, e.g. "Equity or business liquidity"]]'
            - '[[Add: option, e.g. "Inheritance or estate"]]'
            - '[[Add: option, e.g. "Ongoing wealth management"]]'
            - '[[Add: option, e.g. "Other"]]'
        - { name: message, label: A brief note, kind: textarea, required: true }
      submitLabel: Request an introduction
      successText: "[[Add: thank-you message, about 15 words]]"
    details:
      address: '[[Add: address, e.g. "901 Franklin Street, Suite 410, Denver, CO 80206"]]'
      phone: '[[Add: phone, e.g. "+1 303 555 0182"]]'
      email: '[[Add: public email, e.g. "advisory@ellsworthpine.example"]]'
      hours:
        - '[[Add: hours, e.g. "Monday–Thursday · 8:30–5:00"]]'
        - '[[Add: hours, e.g. "Friday · 8:30–3:00"]]'
        - '[[Add: hours, e.g. "Meetings by appointment"]]'
      mapHref: '[[Add: mapHref, e.g. "https://www.openstreetmap.org/search?query=Franklin%20Street%20Denver"]]'

  - type: faq
    variant: split
    tone: muted
    heading: '[[Add: heading, e.g. "What happens next"]]'
    items:
      - q: '[[Add: question, e.g. "What happens in the introductory meeting?"]]'
        a: "[[Add: answer, about 30 words]]"
      - q: '[[Add: question, e.g. "How long until we have a plan?"]]'
        a: "[[Add: answer, about 15 words]]"
      - q: '[[Add: question, e.g. "Can we meet virtually?"]]'
        a: "[[Add: answer, about 15 words]]"
