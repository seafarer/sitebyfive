# Solar / energy template. Generated from src/sites/mesaridge by `npm run templates`; edit the demo, not this file.

slug: /about
title: "About | {{name}}"
description: "[[Add: description, about 15 words]]"
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: '[[Add: eyebrow, e.g. "About us"]]'
    heading: '[[Add: heading, e.g. "Twenty years of solar, one valley."]]'
    intro: "[[Add: intro, about 20 words]]"

  - type: richText
    width: prose
    body: "[[Add: body text, about 80 words]]"

  - type: team
    variant: grid
    columns: 4
    id: team
    tone: tint
    eyebrow: '[[Add: eyebrow, e.g. "Our team"]]'
    heading: "[[Add: heading, e.g. \"The people you'll meet\"]]"
    people:
      - name: '[[Add: name, e.g. "Lena Ortiz"]]'
        role: '[[Add: role, e.g. "Founder and master electrician"]]'
        photo:
          src: team/lena.jpg
          alt: '[[Add: describe the photo, e.g. "Lena Ortiz, founder"]]'
      - name: '[[Add: name, e.g. "Sam Whitehorse"]]'
        role: '[[Add: role, e.g. "Lead system designer"]]'
        photo:
          src: team/sam.jpg
          alt: '[[Add: describe the photo, e.g. "Sam Whitehorse, lead designer"]]'
      - name: '[[Add: name, e.g. "Priya Nair"]]'
        role: '[[Add: role, e.g. "Energy consultant"]]'
        photo:
          src: team/priya.jpg
          alt: '[[Add: describe the photo, e.g. "Priya Nair, energy consultant"]]'
      - name: '[[Add: name, e.g. "Cody Burke"]]'
        role: '[[Add: role, e.g. "Service manager"]]'
        photo:
          src: team/cody.jpg
          alt: '[[Add: describe the photo, e.g. "Cody Burke, service manager"]]'

  - type: features
    variant: list
    heading: '[[Add: heading, e.g. "How we work"]]'
    items:
      - title: '[[Add: title, e.g. "Salaried consultants"]]'
        body: '[[Add: body text, e.g. "No commissions, no upsells."]]'
      - title: '[[Add: title, e.g. "Our own install crew"]]'
        body: '[[Add: body text, e.g. "We never subcontract installs."]]'
      - title: '[[Add: title, e.g. "NABCEP-certified technicians"]]'
      - title: '[[Add: title, e.g. "25-year workmanship warranty"]]'
      - title: "[[Add: title, e.g. \"We service systems we didn't install\"]]"
      - title: '[[Add: title, e.g. "Local office, local phone number"]]'
