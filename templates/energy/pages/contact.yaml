# Solar / energy template. Generated from src/sites/mesaridge by `npm run templates`; edit the demo, not this file.

slug: /contact
title: "Contact | {{name}}"
description: '[[Add: description, e.g. "Book a free, no-obligation solar consultation or a service visit."]]'
blocks:
  - type: pageHeader
    variant: simple
    eyebrow: '[[Add: eyebrow, e.g. "Contact"]]'
    heading: "[[Add: heading, e.g. \"Let's talk about your power.\"]]"

  - type: contact
    variant: form-details
    id: consultation
    heading: '[[Add: heading, e.g. "Book a free consultation"]]'
    intro: "[[Add: intro, about 20 words]]"
    form:
      subject: '[[Add: subject, e.g. "Consultation request"]]'
      fields:
        - { name: name, label: Your name, kind: text, required: true }
        - { name: email, label: Email, kind: email, required: true }
        - { name: phone, label: Phone, kind: tel, required: true }
        - { name: address, label: Property address, kind: text }
        - name: interest
          label: I'm interested in
          kind: select
          options:
            - '[[Add: option, e.g. "Home solar"]]'
            - '[[Add: option, e.g. "Solar plus battery"]]'
            - '[[Add: option, e.g. "Commercial or farm"]]'
            - '[[Add: option, e.g. "Service for an existing system"]]'
            - '[[Add: option, e.g. "Not sure yet"]]'
        - { name: message, label: Anything else we should know?, kind: textarea }
      submitLabel: Request a consultation
      successText: '[[Add: thank-you message, e.g. "Thanks! A consultant will call you within one business day."]]'
    details:
      address: '[[Add: address, e.g. "220 Depot Avenue, Red Butte, CO 81499"]]'
      phone: '[[Add: phone, e.g. "+1 970 555 0182"]]'
      email: '[[Add: public email, e.g. "hello@mesaridge.example"]]'
      hours:
        - '[[Add: hours, e.g. "Mon–Fri 8am–5pm"]]'
