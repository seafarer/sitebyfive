# Solar / energy template. Generated from src/sites/mesaridge by `npm run templates`; edit the demo, not this file.

name: "{{name}}"
status: preview
url: "{{url}}"
locale: en-US

theme:
  preset: "{{preset}}"

organization:
  type: LocalBusiness
  description: "[[Add: description, about 20 words]]"
  email: '[[Add: public email, e.g. "hello@mesaridge.example"]]'
  phone: '[[Add: phone, e.g. "+1 970 555 0182"]]'
  address:
    street: '[[Add: street, e.g. "220 Depot Avenue"]]'
    locality: '[[Add: town, e.g. "Red Butte"]]'
    region: '[[Add: state, e.g. "CO"]]'
    postalCode: '[[Add: postal code, e.g. "81499"]]'
    country: '[[Add: country code, e.g. "US"]]'
  openingHours:
    - '[[Add: opening hours, e.g. Mo-Fr 09:00-17:00, e.g. "Mo-Fr 08:00-17:00"]]'

nav:
  layout: logo-left
  style: solid
  sticky: true
  items:
    - { label: About, href: /about }
    - { label: Residential, href: /residential }
    - { label: Commercial, href: /commercial }
    - { label: Incentives, href: /incentives }
    - { label: Contact, href: /contact }
  cta: { label: Free consultation, href: /contact, style: primary }

footer:
  variant: columns
  blurb: "[[Add: one or two sentences about the organisation, about 20 words]]"
  columns:
    - heading: '[[Add: heading, e.g. "Solar"]]'
      lines:
        - { label: Residential, href: /residential }
        - { label: Commercial, href: /commercial }
        - { label: Service & maintenance, href: /#maintenance }
        - { label: Incentives, href: /incentives }
    - heading: '[[Add: heading, e.g. "Company"]]'
      lines:
        - { label: About us, href: /about }
        - { label: Our team, href: /about#team }
        - { label: Contact, href: /contact }
    - heading: '[[Add: heading, e.g. "Office"]]'
      lines:
        - '[[Add: footer line, e.g. "220 Depot Avenue, Red Butte, CO 81499"]]'
        - '[[Add: footer line, e.g. "Mon–Fri 8am–5pm"]]'
        - '[[Add: footer line, e.g. "+1 970 555 0182"]]'
  legal:
    - "© {year} {{name}}."

pages:
  - home
  - residential
  - commercial
  - about
  - incentives
  - contact
