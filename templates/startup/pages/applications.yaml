# Startup template. Generated from src/sites/lattice by `npm run templates`; edit the demo, not this file.

slug: /applications
title: "Applications | {{name}}"
description: "[[Add: description, about 10 words]]"
blocks:
  - type: pageHeader
    variant: simple
    breadcrumbs: true
    eyebrow: '[[Add: eyebrow, e.g. "Applications"]]'
    heading: '[[Add: heading, e.g. "Built for sites that change faster than infrastructure."]]'
    intro: "[[Add: intro, about 20 words]]"

  - type: cards
    variant: image
    columns: 3
    items:
      - label: '[[Add: label, e.g. "Remote operations"]]'
        tag: '[[Add: tag, e.g. "Most deployed"]]'
        title: '[[Add: title, e.g. "Research and monitoring"]]'
        body: "[[Add: body text, about 10 words]]"
        image:
          src: use-research-station.jpg
          alt: '[[Add: describe the photo, e.g. "A remote research station with an LC-80 and a small wind turbine"]]'
        link: { label: '[[Add: label, e.g. "Remote configurations"]]', href: /applications }
      - label: '[[Add: label, e.g. "Resilience"]]'
        title: '[[Add: title, e.g. "Clinics, shelters, water"]]'
        body: "[[Add: body text, about 15 words]]"
        image:
          src: use-water-plant.jpg
          alt: '[[Add: describe the photo, e.g. "An LC-80 behind a fence at a municipal water pump station"]]'
        link: { label: '[[Add: label, e.g. "Resilience deployments"]]', href: /applications }
      - label: '[[Add: label, e.g. "Fleet electrification"]]'
        tag: '[[Add: tag, e.g. "New"]]'
        title: '[[Add: title, e.g. "Temporary charging"]]'
        body: "[[Add: body text, about 15 words]]"
        image:
          src: use-fleet-yard.jpg
          alt: '[[Add: describe the photo, e.g. "Electric bucket trucks lined up at LC-80 charging points"]]'
        link: { label: '[[Add: label, e.g. "Mobile charging"]]', href: /applications }

  - type: featureRows
    tone: muted
    heading: '[[Add: heading, e.g. "What changes by application"]]'
    startSide: left
    items:
      - label: '[[Add: label, e.g. "Remote"]]'
        title: '[[Add: title, e.g. "Fuel is the cost you’re really managing."]]'
        body: "[[Add: body text, about 30 words]]"
      - label: '[[Add: label, e.g. "Resilience"]]'
        title: '[[Add: title, e.g. "Runtime is the number that matters."]]'
        body: "[[Add: body text, about 20 words]]"
      - label: '[[Add: label, e.g. "Fleets"]]'
        title: '[[Add: title, e.g. "Peak demand is the bill you avoid."]]'
        body: "[[Add: body text, about 20 words]]"

  - type: cta
    variant: split
    tone: inverse
    heading: '[[Add: heading, e.g. "Not sure which configuration fits?"]]'
    body: "[[Add: body text, about 15 words]]"
    ctas:
      - { label: '[[Add: label, e.g. "Plan a pilot"]]', href: /pilot, style: primary }
    details: "[[Add: details, about 15 words]]"
