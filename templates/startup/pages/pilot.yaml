# Startup template. Generated from src/sites/lattice by `npm run templates`; edit the demo, not this file.

slug: /pilot
title: "Plan a field pilot | {{name}}"
description: "[[Add: description, about 20 words]]"
chrome:
  announcement: false
  footer: false
  nav:
    minimal: true
    cta: { label: Request a pilot, href: "#request", style: primary }
blocks:
  - type: hero
    variant: split
    imageSide: left
    eyebrow: '[[Add: eyebrow, e.g. "Field pilot program"]]'
    heading: '[[Add: heading, e.g. "Prove it on your hardest site in 90 days."]]'
    body: "[[Add: body text, about 20 words]]"
    image:
      src: pilot-hero-commissioning.jpg
      alt: '[[Add: describe the photo, e.g. "A Lattice field engineer commissioning an LC-80 with a site operator"]]'
      focal: 40% 50%
    ctas:
      - { label: '[[Add: label, e.g. "Request a site review"]]', href: "#request", style: primary }
      - { label: '[[Add: label, e.g. "See pricing"]]', href: "#pricing", style: text }
    meta: '[[Add: short supporting line, e.g. "Lattice Current · Austin, Texas"]]'

  - type: cards
    variant: numbered
    columns: 4
    tone: muted
    heading: '[[Add: heading, e.g. "How a pilot runs"]]'
    items:
      - title: '[[Add: title, e.g. "Site review"]]'
        body: "[[Add: body text, about 15 words]]"
      - title: '[[Add: title, e.g. "Model and plan"]]'
        body: '[[Add: body text, e.g. "A configuration, deployment plan, and the metrics we’ll be judged on."]]'
      - title: '[[Add: title, e.g. "Deploy"]]'
        body: '[[Add: body text, e.g. "Delivery, commissioning, and operator training, usually within a week."]]'
      - title: '[[Add: title, e.g. "Close out"]]'
        body: '[[Add: body text, e.g. "Ninety days of monitoring, then a report against the agreed metrics."]]'

  - type: pricing
    variant: tiers
    id: pricing
    eyebrow: '[[Add: eyebrow, e.g. "Pilot pricing"]]'
    heading: '[[Add: heading, e.g. "Clear terms before anything ships"]]'
    items:
      - name: '[[Add: name, e.g. "Site review"]]'
        price: '[[Add: price, e.g. "Free"]]'
        description: '[[Add: description, e.g. "For teams exploring whether storage fits."]]'
        features:
          - '[[Add: features, e.g. "Load and source review"]]'
          - '[[Add: features, e.g. "Configuration recommendation"]]'
          - '[[Add: features, e.g. "Indicative payback estimate"]]'
        cta: { label: '[[Add: label, e.g. "Start a review"]]', href: "#request", style: secondary }
      - name: '[[Add: name, e.g. "Field pilot"]]'
        price: '[[Add: price, e.g. "$48k"]]'
        unit: '[[Add: unit, e.g. "/ 90 days"]]'
        description: '[[Add: description, e.g. "One LC-80, fully supported."]]'
        features:
          - '[[Add: features, e.g. "Delivery and commissioning"]]'
          - '[[Add: features, e.g. "Operator training"]]'
          - '[[Add: features, e.g. "Remote monitoring"]]'
          - '[[Add: features, e.g. "Closeout report"]]'
          - '[[Add: features, e.g. "Credit toward purchase"]]'
        featured: true
        cta: { label: '[[Add: label, e.g. "Plan a pilot"]]', href: "#request", style: primary }
      - name: '[[Add: name, e.g. "Fleet program"]]'
        price: '[[Add: price, e.g. "Custom"]]'
        description: '[[Add: description, e.g. "Multiple sites or units."]]'
        features:
          - '[[Add: features, e.g. "Standardized site kits"]]'
          - '[[Add: features, e.g. "Volume pricing"]]'
          - '[[Add: features, e.g. "Dedicated field engineer"]]'
        cta: { label: '[[Add: label, e.g. "Talk to us"]]', href: "#request", style: secondary }
    note: "[[Add: note, about 10 words]]"

  - type: faq
    variant: stacked
    heading: '[[Add: heading, e.g. "Pilot questions"]]'
    items:
      - q: '[[Add: question, e.g. "What if the pilot doesn’t hit the metrics?"]]'
        a: "[[Add: answer, about 20 words]]"
      - q: '[[Add: question, e.g. "Does the pilot fee count toward a purchase?"]]'
        a: "[[Add: answer, about 15 words]]"
      - q: '[[Add: question, e.g. "Who operates the unit during the pilot?"]]'
        a: "[[Add: answer, about 10 words]]"

  - type: contact
    variant: form
    id: request
    tone: inverse
    eyebrow: '[[Add: eyebrow, e.g. "Request a site review"]]'
    heading: '[[Add: heading, e.g. "Tell us about the site."]]'
    intro: '[[Add: intro, e.g. "A field engineer will reply within two business days."]]'
    form:
      action: /api/contact
      subject: '[[Add: subject, e.g. "Pilot site review request"]]'
      fields:
        - { name: name, label: Name, kind: text, required: true }
        - { name: email, label: Work email, kind: email, required: true }
        - { name: organization, label: Organization, kind: text, required: true }
        - name: application
          label: Application
          kind: select
          required: true
          options:
            - '[[Add: option, e.g. "Remote operations"]]'
            - '[[Add: option, e.g. "Resilience"]]'
            - '[[Add: option, e.g. "Fleet charging"]]'
            - '[[Add: option, e.g. "Something else"]]'
        - { name: message, label: What does the site need?, kind: textarea, required: true }
      submitLabel: Request a site review
      successText: '[[Add: thank-you message, e.g. "Thanks. A field engineer will be in touch within two business days."]]'
