# Startup template. Generated from src/sites/lattice by `npm run templates`; edit the demo, not this file.

slug: /
title: "{{name}} | [[Add: short tagline]]"
description: "[[Add: description, about 15 words]]"
chrome:
  nav: { style: transparent }
blocks:
  - type: hero
    variant: full-bleed
    eyebrow: '[[Add: eyebrow, e.g. "Deployable energy systems"]]'
    heading: '[[Add: heading, e.g. "Power that lands where the grid can’t."]]'
    body: "[[Add: body text, about 25 words]]"
    image:
      src: home-hero-field.jpg
      alt: '[[Add: describe the photo, e.g. "An LC-80 power cabinet beside a temporary solar array at a remote desert site at dusk"]]'
      focal: 60% 55%
    ctas:
      - { label: '[[Add: label, e.g. "Plan a field pilot"]]', href: /pilot, style: primary }
      - { label: '[[Add: label, e.g. "Explore the platform"]]', href: /platform, style: secondary }
    meta: '[[Add: short supporting line, e.g. "Designed, tested, and assembled in Austin, Texas"]]'

  - type: intro
    variant: two-column
    id: platform
    eyebrow: '[[Add: eyebrow, e.g. "The platform"]]'
    heading: '[[Add: heading, e.g. "One field-ready cabinet. Many ways to make and move energy."]]'
    body: "[[Add: body text, about 40 words]]"
    link: { label: '[[Add: label, e.g. "See the full platform"]]', href: /platform, style: text }

  - type: cards
    variant: icon
    columns: 3
    tone: muted
    eyebrow: '[[Add: eyebrow, e.g. "Built as a system"]]'
    heading: '[[Add: heading, e.g. "Everything needed to energize a site"]]'
    intro: "[[Add: intro, about 15 words]]"
    items:
      - title: '[[Add: title, e.g. "Rugged by default"]]'
        body: "[[Add: body text, about 15 words]]"
        icon: shield-check
      - title: '[[Add: title, e.g. "Source-flexible"]]'
        body: "[[Add: body text, about 15 words]]"
        icon: plug-zap
      - title: '[[Add: title, e.g. "Visible from anywhere"]]'
        body: "[[Add: body text, about 15 words]]"
        icon: radar
    tags:
      label: '[[Add: label, e.g. "Standard interfaces"]]'
      items:
        - '[[Add: items, e.g. "120/208V"]]'
        - '[[Add: items, e.g. "480V option"]]'
        - '[[Add: items, e.g. "Modbus"]]'
        - '[[Add: items, e.g. "CAN"]]'
        - '[[Add: items, e.g. "LTE + satellite-ready"]]'

  - type: featureRows
    id: applications
    eyebrow: '[[Add: eyebrow, e.g. "Applications"]]'
    heading: '[[Add: heading, e.g. "Designed for work that can’t wait on infrastructure"]]'
    intro: '[[Add: intro, e.g. "Start with one unit. Add capacity or generation as the mission grows."]]'
    startSide: right
    items:
      - label: '[[Add: label, e.g. "Remote operations"]]'
        title: '[[Add: title, e.g. "Run instruments, comms, and crews with less fuel logistics."]]'
        body: "[[Add: body text, about 15 words]]"
        image:
          src: app-remote-ops.jpg
          alt: '[[Add: describe the photo, e.g. "Two field engineers checking an LC-80 cabinet next to a weather research mast"]]'
        link: { label: '[[Add: label, e.g. "Remote configurations"]]', href: /applications, style: text }
      - label: '[[Add: label, e.g. "Resilience"]]'
        title: '[[Add: title, e.g. "Keep essential facilities online through an outage."]]'
        body: "[[Add: body text, about 20 words]]"
        image:
          src: app-resilience-clinic.jpg
          alt: '[[Add: describe the photo, e.g. "An LC-80 installed behind a rural health clinic, cables running to the building"]]'
        link: { label: '[[Add: label, e.g. "Resilience deployments"]]', href: /applications, style: text }
      - label: '[[Add: label, e.g. "Fleet electrification"]]'
        title: '[[Add: title, e.g. "Bring charging to the vehicles instead of waiting for the depot."]]'
        body: "[[Add: body text, about 20 words]]"
        image:
          src: app-fleet-charging.jpg
          alt: '[[Add: describe the photo, e.g. "Electric utility trucks charging from a pair of LC-80 units in a gravel yard"]]'
        link: { label: '[[Add: label, e.g. "Mobile charging"]]', href: /applications, style: text }

  - type: cards
    variant: numbered
    columns: 3
    id: how-it-works
    tone: inverse
    eyebrow: '[[Add: eyebrow, e.g. "A practical path to deployment"]]'
    heading: '[[Add: heading, e.g. "From site data to live power in three steps"]]'
    items:
      - label: '[[Add: label, e.g. "Step 01"]]'
        title: '[[Add: title, e.g. "Model the site"]]'
        body: "[[Add: body text, about 15 words]]"
      - label: '[[Add: label, e.g. "Step 02"]]'
        title: '[[Add: title, e.g. "Prove it in a pilot"]]'
        body: "[[Add: body text, about 15 words]]"
      - label: '[[Add: label, e.g. "Step 03"]]'
        title: '[[Add: title, e.g. "Scale with confidence"]]'
        body: "[[Add: body text, about 15 words]]"
    link: { label: '[[Add: label, e.g. "How pilots work"]]', href: /pilot, style: secondary }

  - type: cta
    variant: with-images
    id: contact
    eyebrow: '[[Add: eyebrow, e.g. "Bring us the hard site"]]'
    heading: '[[Add: heading, e.g. "Let’s map the fastest path to dependable power."]]'
    body: "[[Add: body text, about 20 words]]"
    ctas:
      - { label: '[[Add: label, e.g. "Request a site review"]]', href: /pilot, style: primary }
      - label: '[[Add: label, e.g. "Email field engineering"]]'
        href: mailto:field@{{id}}current.example
        style: text
    images:
      - src: cta-field-crew.jpg
        alt: '[[Add: describe the photo, e.g. "A field crew unloading an LC-80 from a flatbed trailer"]]'
      - src: cta-cabinet-detail.jpg
        alt: "[[Add: describe the photo, e.g. \"Close-up of the LC-80's sealed connector panel\"]]"
      - src: cta-console.jpg
        alt: '[[Add: describe the photo, e.g. "The LatticeOS console on a tablet showing load and state of charge"]]'
